// Toda corrección de la persona se guarda con definido_por: persona; el motor anota corrigio_ficha
function guardarFicha(campo, cambios, alGuardar) {
  const m = estado.hoja;
  if (!m || !m.datos) return;
  const p = m.datos;
  const antes = {};
  Object.keys(cambios).forEach(k => { antes[k] = p[k]; });
  Object.assign(p, cambios);
  estado.ui[campo] = { fase: 'enviando' };
  pintarFicha();
  const datos = Object.assign({ id: p.id, definido_por: 'persona' }, campo === 'ensenar' ? { notas: p.notasTexto } : cambios);
  pedir('guardar_memoria', { parte: 'fichas', datos: datos })
    .then(r => { estado.ui[campo] = { fase: 'hecho', id_accion: r.id_accion }; p.definido = 'Lo definiste tú'; p.actualizada = ahora(); if (alGuardar) alGuardar(); anunciar('Guardado.'); })
    .catch(e => { Object.assign(p, antes); estado.ui[campo] = { fase: 'error', texto: textoError(e, 'No se pudo guardar.'), reintentar: () => guardarFicha(campo, cambios, alGuardar) }; })
    .then(() => { if (estado.hoja === m) { pintarFicha(); const b = hoja.querySelector('[data-campo="' + campo + '"][aria-checked="true"]'); if (b) b.focus({ preventScroll: true }); } });
}
function guardarRelacion(relacion) {
  const m = estado.hoja;
  if (!m || !m.datos) return;
  m.modo = 'ficha';
  if (relacion === m.datos.relacion) { pintarFicha(); enfocarHoja(); return; }
  guardarFicha('relacion', { relacion: relacion });
  enfocarHoja();
}
function guardarEnsenanza() {
  const m = estado.hoja;
  if (!m || !m.datos) return;
  const nota = m.borrador.trim();
  if (!nota) return;
  const p = m.datos;
  const notas = [nota].concat(p.notas);
  guardarFicha('ensenar', { notas: notas, notasTexto: notas.join('\n') }, () => { m.borrador = ''; });
}
function fichaActual() {
  const m = estado.hoja;
  return m && m.tipo === 'ficha' ? { ref: m.ref, nombre: (m.datos && m.datos.nombre) || m.nombre, desde: m.desde } : null;
}

/* ---------- Lo que Opus sabe de ti ----------
   El cuaderno de Opus, de solo lectura: lo que aprendió, lo que la persona le
   corrigió y lo que todavía no sabe. Cada lección abre su evidencia, el cambio
   que provocó y su deshacer. */
const PARTES_VISTA = [
  ['aprendi', 'Lo que aprendió', 'destello', 'morado', ''],
  ['corregiste', 'Lo que le corregiste', 'lapiz', 'naranja', 'Lo que le corriges manda sobre todo lo demás.'],
  ['no_se', 'Lo que todavía no sabe', 'destello-trazo', 'neutro', '']
];
const NOMBRE_VISTA = { hoy: 'Hoy', seguimiento: 'Seguimiento', politicas: 'Reglas', actividad: 'Actividad', plan: 'Tus instrucciones', como: 'Cómo se usa' };

function pintarCuaderno() {
  const d = estado.datos.cuaderno;
  const volver = estado.vistaAnterior && estado.vistaAnterior !== 'cuaderno' ? estado.vistaAnterior : 'hoy';
  const sub = 'Opus lo anota mientras trabaja. ' + (d && d.actualizado ? 'Lo ordenó ' + diaRelativo(d.actualizado) + '.' : 'Lo ordena cada domingo.');
  let html = cabecera(NOMBRE_CUADERNO, sub, { volver: { vista: volver, texto: NOMBRE_VISTA[volver] || 'Hoy' } });
  if (!d) return html + (estado.error.cuaderno ? errorVista('cuaderno') : cargando());
  html += avisoRefresco('cuaderno') + loDeTi(d);
  if (d.vacio) return html + seccion('', '<div class="item fila">' + mosaico('destello', 'morado') + '<p class="fila__txt fila__t">Opus todavía no anota nada. Empieza con tu primer día.</p></div>');
  PARTES_VISTA.forEach(([k, titulo, icono, tonoP, pie]) => {
    const lista = d.partes[k];
    if (!lista.length) return;
    html += seccion(titulo, lista.map((l, i) => filaLeccion(l, k + ':' + i, icono, tonoP)).join(''), esc(pie), '', 'cab-' + k.replace('_', '-'), 'grupo--mosaico');
  });
  return html;
}

// Lo que importa, tu gente y cómo escribes, cada uno con su camino para corregirlo
function loDeTi(d) {
  let h = '';
  if (d.perfil && d.perfil.texto) h += seccion('Lo que importa', '<div class="item"><p class="fila__t leccion__t">' + escSinCorte(d.perfil.texto) + '</p>' +
    '<div class="acciones"><button class="btn btn--t" data-accion="ir" data-vista="politicas"' + foco('cuad-perfil') + '>Cambiar en Reglas</button></div></div>', '', '', 'cab-importa');
  if (d.gente && d.gente.length) h += seccion('Tu gente', d.gente.map(f => '<div class="item fila">' + mono(f.nombre, { org: f.tipo === 'organizacion' }) + '<div class="fila__txt"><p class="fila__t">' +
    botonFicha(f.nombre, { ficha: f.id, org: f.tipo === 'organizacion' }, 'cuad-ficha:' + f.id) + '</p>' + ((f.relacion || f.rol) ? '<p class="fila__s">' + esc(f.relacion || f.rol) + '</p>' : '') + '</div></div>').join(''),
    'Toca un nombre para ver su hoja y corregirla.', '', 'cab-tu-gente');
  if (d.estilo && d.estilo.texto) h += seccion('Cómo escribes', '<div class="item"><p class="fila__t leccion__t">' + escSinCorte(d.estilo.texto) + '</p></div>', 'Opus lo aprende de cada borrador que corriges antes de enviar.', '', 'cab-escribes');
  return h;
}

function filaLeccion(l, k, icono, tonoP) {
  const clave = 'cuad:' + k;
  const u = estado.ui[clave] || {};
  const detalle = l.evidencia || l.cambio || l.ref || l.deshacer;
  const cambio = l.cambio || textoCambio(l.ref);
  const fecha = l.fecha ? '<span class="leccion__fecha">' + esc(l.fecha) + '</span>' : '';
  if (u.fase === 'hecho') {
    return '<div class="item fila" tabindex="-1"' + foco('msg:' + clave) + '>' + mosaico(icono, 'neutro') + '<div class="fila__txt"><p class="fila__t tenue">' + esc(l.texto) + '</p>' +
      '<p class="fila__s">Deshecho. Opus lo deja de aplicar desde ahora.</p></div></div>';
  }
  if (!detalle) return '<div class="item fila">' + mosaico(icono, tonoP) + '<div class="fila__txt"><p class="fila__t leccion__t">' + esc(l.texto) + '</p>' + (fecha ? '<p class="fila__s">' + fecha + '</p>' : '') + '</div></div>';
  const abierto = !!estado.abierto[clave];
  const id = 'lec-' + idSeguro(k);
  let html = '<div class="item"><div class="prop">' + mosaico(icono, tonoP) + '<div>' +
    '<button class="linea-si leccion" data-accion="porque" data-clave="' + esc(clave) + '" aria-expanded="' + abierto + '" aria-controls="' + id + '"' + foco('lec:' + clave) + '>' +
    '<span class="leccion__t">' + esc(l.texto) + '</span>' + fecha + '</button>';
  if (abierto) {
    html += '<dl class="leccion__detalle" id="' + id + '">' +
      (l.evidencia ? '<dt>Por qué lo sabe</dt><dd>' + escSinCorte(mayus(l.evidencia)) + '</dd>' : '') +
      (cambio ? '<dt>Qué cambió</dt><dd>' + esc(mayus(cambio)) + '</dd>' : '') + '</dl>';
    const ir = enlaceCambio(l.ref, clave);

function toparHoy() {

  const tarjetas = [...g.children].filter(e => e.matches('.item[data-quitar]') && !sensibles.has(e.dataset.quitar));

  if (alto() <= tope || tarjetas.length < 2) return;
  const fila = document.createElement('div');
  fila.className = 'item fila';
  g.appendChild(fila);
  let ocultas = 0;
  do {
    tarjetas[tarjetas.length - 1 - ocultas].hidden = true; ocultas++;
    fila.innerHTML = '<button class="btn btn--t" data-accion="hoy-ver-mas"' + foco('hoy-ver-mas') + '>Ver ' + ocultas + ' más</button>';
  } while (alto() > tope && tarjetas.length - ocultas > 1);

// En automático, cuenta como leído solo lo que estuvo en la pantalla: la tarjeta de un resumen completo, sin leer y no
// sensible, a la vista al menos a la mitad durante un segundo seguido. Cada hilo va una vez; consultar Hoy no marca nada
const VISTO_MS = 1000;
const visto = { obs: null, desde: {}, relojes: {}, lote: [], envio: null };
function tarjetaDe(id) {
  const e = window.CSS && CSS.escape ? CSS.escape(id) : id;
  const el = principal.querySelector('[data-quitar="' + e + '"]') || principal.querySelector('[data-hilo="' + e + '"]');
  return el ? (el.closest('.item') || el) : null;
}
// A la vista: la mitad de la tarjeta dentro de la pantalla, o media pantalla ocupada por ella si es más alta
function enPantalla(el) {
  if (!el || !el.isConnected || document.visibilityState === 'hidden') return false;
  const r = el.getBoundingClientRect(), alto = window.innerHeight || document.documentElement.clientHeight, ancho = window.innerWidth || document.documentElement.clientWidth;
  if (!r.width || !r.height) return false;
  const v = Math.min(r.bottom, alto) - Math.max(r.top, 0), h = Math.min(r.right, ancho) - Math.max(r.left, 0);
  return h > 0 && v > 0 && (v >= r.height / 2 || v >= alto / 2);
}
function pararVisto() {
  if (visto.obs) { visto.obs.disconnect(); visto.obs = null; }
  Object.keys(visto.relojes).forEach(id => clearTimeout(visto.relojes[id]));
  visto.relojes = {};
}
function enterarseDeLoVisible() {
  pararVisto();
  const d = estado.datos.hoy;
  if (estado.vista !== 'hoy' || !d || !enAutomatico(d) || estado.pausado || typeof IntersectionObserver !== 'function') { visto.desde = {}; return; }
  const enviados = estado.enteradoVisto || (estado.enteradoVisto = {});
  const tarjetas = new Map();
  d.te_necesita.filter(j => j.resumido && j.sin_leer && !j.sensible && !enviados[j.id_hilo]).forEach(j => { const el = tarjetaDe(j.id_hilo); if (el) tarjetas.set(el, j.id_hilo); });
  const vigentes = new Set(tarjetas.values());
  Object.keys(visto.desde).forEach(id => { if (!vigentes.has(id)) delete visto.desde[id]; });
  if (!tarjetas.size) return;
  // Si sale de la pantalla antes del segundo, la cuenta vuelve a empezar
  const revisar = (id, el) => {
    clearTimeout(visto.relojes[id]); delete visto.relojes[id];
    if (enviados[id]) return;
    if (!enPantalla(el)) { delete visto.desde[id]; return; }
    const desde = visto.desde[id] || (visto.desde[id] = Date.now()), falta = desde + VISTO_MS - Date.now();
    if (falta > 0) visto.relojes[id] = setTimeout(() => revisar(id, el), falta + 20);
    else anotarVisto(id);
  };
  visto.obs = new IntersectionObserver(es => es.forEach(x => { const id = tarjetas.get(x.target); if (id) revisar(id, x.target); }), { threshold: [0, 0.25, 0.5, 0.75, 1] });
  tarjetas.forEach((id, el) => visto.obs.observe(el));
}
document.addEventListener('visibilitychange', () => { if (estado.vista === 'hoy') enterarseDeLoVisible(); });
function anotarVisto(id) {
  const enviados = estado.enteradoVisto || (estado.enteradoVisto = {});
  if (enviados[id]) return;
  enviados[id] = 1; delete visto.desde[id];

function mandarVistos() {

    const leidos = res.filter(x => !x.error && !x.quedan_sin_leer && !x.sin_cambio && (x.mensajes || x.id_accion)).map(x => x.id_hilo);

      const claves = lista.map(p => 'prop:' + p.id), bien = claves.filter(k => (estado.ui[k] || {}).fase === 'hecho');
      const n = claves.length, b = bien.length, faltan = n - b;
      const lineas = bien.map(k => sinPrefijoListo(estado.ui[k].texto));
      if (!b) estado.ui.todo = previo || { fase: 'error', texto: 'No se guardó ninguna de las ' + n + '. Reintenta en cada una.' };
      else estado.ui.todo = { fase: 'hecho',
        texto: !faltan ? 'Acepté estas ' + n + ':' : 'Acepté ' + b + ' de ' + n + '. ' + (faltan === 1 ? 'La otra no se guardó: reintenta en ella.' : 'Las otras ' + faltan + ' no se guardaron: reintenta en cada una.'),
        claves: (previo ? previo.claves : []).concat(bien), lineas: (previo ? previo.lineas : []).concat(lineas),
        ids: (previo ? previo.ids : []).concat(bien.map(k => estado.ui[k].id_accion).filter(Boolean)) };
      estado.focoSiguiente = b ? 'msg:todo' : 'reintentar:' + claves[0];

}
// Deshacer del lote: revierte cada respuesta y las líneas vuelven a la lista
function deshacerTodo() {
  const t = estado.ui.todo;
  if (!t || !t.ids || !t.ids.length) return;
  const pendientes = t.ids.slice(), n = t.claves.length;
  actuar('des:todo', async () => { let r = {}; while (pendientes.length) { r = await pedir('deshacer', { id: pendientes[0] }); pendientes.shift(); } return r; }, null, {
    alTerminar: () => { t.claves.forEach(k => { delete estado.ui[k]; }); delete estado.ui.todo; cargar(estado.vista); return { texto: n === 1 ? 'Deshice tu respuesta.' : 'Deshice las ' + n + ' respuestas.' }; },
    foco: false, error: 'No se pudo deshacer.'
  });

// Una línea de política en «Te aviso» puede juntar varias acciones: Deshacer las revierte todas
// Con varias acciones, la línea se deshace con su id y el motor las resuelve en un guardado. Si no le alcanza el tiempo,
// contesta quedan y la misma llamada se repite. Si el motor no conoce el id de la línea (versión anterior), va una llamada por acción
async function deshacerLinea(linea) {
  let r = await pedir('deshacer', { id: linea });
  if (r.repetida) return 'Ya estaba deshecho.';
  let hechas = numero(r.deshechas), omitidas = 0;
  const cuenta = x => Math.max(0, numero(x.omitidas_total) || (x.omitidas || []).length) - (x.omitidas || []).filter(o => /ya se deshizo/i.test(o.motivo || '')).length;
  omitidas += cuenta(r);
  for (let vuelta = 0; numero(r.quedan) > 0 && vuelta < 30; vuelta++) {
    r = await pedir('deshacer', { id: linea });
    hechas += numero(r.deshechas); omitidas += cuenta(r);
  }
  const sin = numero(r.sin_deshacer);
  const partes = [omitidas > 0 ? (omitidas === 1 ? 'Una acción no se pudo deshacer' : omitidas + ' acciones no se pudieron deshacer') : '',
    sin > 0 ? plural(sin, 'correo ya no se puede deshacer', 'correos ya no se pueden deshacer') : ''].filter(Boolean);
  return (hechas || !partes.length ? 'Deshecho.' : 'No deshice nada.') + (partes.length ? ' ' + partes.join('. ') + '.' : '');
}
async function deshacerAviso(clave, ids, linea) {
  if (!ids.length) return;
  estado.ui[clave] = { fase: 'enviando' };
  pintar();
  try {
    let texto = null;
    if (linea && ids.length > 1) {
      try { texto = await deshacerLinea(linea); } catch (e) { if (!/no hay una acci/i.test(String(e && e.message))) throw e; }
    }
    if (texto === null) { for (const id of ids) await pedir('deshacer', { id: id }); texto = 'Deshecho.'; }
    estado.ui[clave] = { fase: 'hecho', texto: texto };
    estado.focoSiguiente = 'msg:' + clave;
    anunciar(texto);
  } catch (e) {
    estado.ui[clave] = { fase: 'error', texto: textoError(e, 'No se pudo deshacer.'), reintentar: () => deshacerAviso(clave, ids, linea) };
    estado.focoSiguiente = 'reintentar:' + clave;
  }
  pintar();
}

    { alTerminar: () => Object.assign({ tipo: 'cerrar' }, texto ? { texto: texto } : {}), error: 'No se pudo cerrar el seguimiento.' });
}

// iPhone y iPad: el enlace a la app de Gmail sale del iframe de Apps Script con el toque (target _top). Si en 1.5 s la página
// sigue a la vista, dejo la vista móvil del correo junto al botón; nunca la abro sola. Safari pregunta antes de abrir la app con la
// página a la vista: si se oculta después, la app abrió y el enlace se quita
function abrirGmailApp(a) {
  a.target = '_top';
  const m = /cv=([^/]+)/.exec(a.getAttribute('href')), web = m ? urlHiloMovil(decodeURIComponent(m[1])) : BASE_GMAIL;
  let enlace = null, reloj = 0;
  const salir = () => {
    clearTimeout(reloj);
    if (enlace) enlace.remove();
    window.removeEventListener('pagehide', salir);
    document.removeEventListener('visibilitychange', vista);
  };
  const vista = () => { if (document.hidden) salir(); };
  window.addEventListener('pagehide', salir);
  document.addEventListener('visibilitychange', vista);
  reloj = setTimeout(() => {
    if (document.hidden) return salir();
    if (!a.isConnected) return;
    const junto = a.nextElementSibling;
    if (junto && junto.classList.contains('gmail-web')) { enlace = junto; return; }
    a.insertAdjacentHTML('afterend', '<a class="enlace gmail-web" href="' + esc(web) + '" target="_blank" rel="noopener">Ábrelo en Gmail en el navegador</a>');
    enlace = a.nextElementSibling;
  }, 1500);
}

document.addEventListener('click', ev => {
  // El toque que termina un desliz no abre la fila ni su enlace; lo demás (Deshacer, por ejemplo) sí responde
  if (Date.now() - ultimoDesliz.t < 500 && ultimoDesliz.card && ultimoDesliz.card.contains(ev.target)) { ev.preventDefault(); return; }
  const g = ev.target.closest('a[href^="googlegmail:///cv="]');
  if (g) { abrirGmailApp(g); return; }
  const el = ev.target.closest('[data-accion]');
  if (!el || el.disabled) return;
  const f = ACCIONES[el.dataset.accion];
  if (!f) return;
  ev.preventDefault();
  f(el.dataset, el);
});

document.addEventListener('change', ev => {
  const el = ev.target;
  const d = estado.datos.plan;
  if (el.dataset.campo === 'plan' && d) {
    const p = d.todas.find(x => x.id === el.dataset.id);
    if (!p) return;
    estado.plan.respuestas[p.id] = { opcion: valorDe(p, el.value), texto: '' };
    pintar();
  } else if (el.dataset.campo === 'plan-si' && d) {
    const p = d.todas.find(x => x.id === el.dataset.id);
    if (!p) return;
    estado.plan.respuestas[p.id] = { opcion: el.checked ? (p.recomendada && p.recomendada !== 'apagado' ? p.recomendada : 'avisa') : 'apagado', texto: '' };
    pintar();
  } else if (el.dataset.campo === 'carpeta-marca' && d) {
    const c = d.carpetas.find(x => x.id === el.dataset.id);
    if (!c) return;
    if (el.checked) {
      estado.plan.respuestas[c.id] = { opcion: 'crear', texto: '' };
    } else {
      estado.plan.respuestas[c.id] = { opcion: 'no', texto: '' };
      // Lo que estaba juntado en ella vuelve a ser su propia carpeta
      d.carpetas.forEach(x => { const r = estado.plan.respuestas[x.id]; if (r && r.opcion === 'juntar' && r.texto === c.clave) estado.plan.respuestas[x.id] = { opcion: 'crear', texto: '' }; });
    }
    pintar();
  } else if (el.dataset.campo === 'carpeta-plan' && d) {
    const id = el.dataset.id, previa = estado.plan.respuestas[id] || {};
    const v = el.value;
    if (v.indexOf('juntar:') !== 0) delete estado.plan.juntar[id];
    estado.plan.respuestas[id] = v.indexOf('juntar:') === 0 ? { opcion: 'juntar', texto: v.slice(7) } : v === 'no' ? { opcion: 'no', texto: '' } : { opcion: 'crear', texto: previa.opcion === 'crear' ? previa.texto || '' : '' };
    pintar();
  }
});

document.addEventListener('input', ev => {
  const el = ev.target;
  const campo = el.dataset.campo;
  if (campo === 'renombrar') {
    const c = estado.datos.plan && estado.datos.plan.carpetas.find(x => x.id === el.dataset.id);
    if (!c) return;
    const v = el.value.trim();
    estado.plan.respuestas[c.id] = { opcion: 'crear', texto: v && v !== c.nombre ? v : '' };
    const b = principal.querySelector('[data-accion="aceptar-plan"]');
    if (b && !estado.ui.plan) { const n = cambiosPlan(); b.textContent = n ? 'Acepto con ' + plural(n, 'cambio') : 'Acepto todo'; }
    return;
  }
  if (campo === 'nueva-carpeta') { estado.plan.nueva = el.value; return; }
  // «Cambiar en palabras» en Cómo trabajo para ti: el texto va con la opción al aceptar el plan
  if (campo === 'plan-texto') {
    const r = estado.plan.respuestas[el.dataset.id];
    if (r) r.texto = el.value.trim();
    ajustarAlto(el);
    const b = principal.querySelector('[data-accion="aceptar-plan"]');
    if (b && !estado.ui.plan) { const n = cambiosPlan(); b.textContent = n ? 'Acepto con ' + plural(n, 'cambio') : 'Acepto todo'; }
    return;
  }
  if (campo === 'otra') {
    estado.otra[el.dataset.id] = el.value;
    ajustarAlto(el);
    const b = principal.querySelector('[data-accion="responder-texto"][data-id="' + el.dataset.id + '"]');
    if (b) b.hidden = !el.value.trim();
    return;
  }
  if (campo === 'ensenar') {
    const m = estado.hoja;
    if (!m) return;
    m.borrador = el.value;
    if (estado.ui.ensenar && estado.ui.ensenar.fase !== 'enviando') delete estado.ui.ensenar;
    ajustarAlto(el);
    const boton = hoja.querySelector('[data-accion="ensenar"]');
    if (boton) boton.hidden = !el.value.trim();
    const est = document.getElementById('ensenar-estado');
    if (est) est.textContent = '';
    return;
  }
  if (campo === 'pedir') {
    estado.pedirBorrador = el.value;
    if (estado.ui.pedir && estado.ui.pedir.fase !== 'enviando') delete estado.ui.pedir;
    ajustarAlto(el);
    const boton = principal.querySelector('[data-accion="pedir-politica"]');
    if (boton) boton.hidden = !el.value.trim();
    const est = document.getElementById('pedir-estado');
    if (est) est.textContent = '';
    return;
  }
  if (campo !== 'perfil') return;
  const perfil = estado.datos.politicas.perfil;
  estado.perfilBorrador = el.value;
  if (estado.ui.perfil && estado.ui.perfil.fase !== 'enviando') delete estado.ui.perfil;
  ajustarAlto(el);
  const sucio = el.value !== perfil.texto;
  const boton = principal.querySelector('[data-accion="guardar-perfil"]');
  if (boton) boton.hidden = !sucio;
  const est = document.getElementById('perfil-estado');
  if (est) est.textContent = sucio ? 'Sin guardar' : (perfil.actualizada ? 'Actualizado ' + diaRelativo(perfil.actualizada) : '');
});

// Deslizar una tarjeta de Hoy a un lado la quita, igual que «Baja» en su prioridad: sale de Hoy, Opus aprende y queda
// Deshacer. En Seguimiento, igual que «Dejarlo». Solo con el dedo; con mouse o teclado están sus botones. Lo vertical sigue siendo scroll
let desliz = null, ultimoDesliz = { t: 0, card: null };
function regresarTarjeta(d) { d.card.classList.remove('item--deslizando'); d.card.style.transform = ''; d.card.style.opacity = ''; }
document.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse' || !ev.isPrimary) return;
  const card = ev.target.closest && ev.target.closest('[data-quitar], [data-quitar-seg]');
  if (!card || ev.target.closest('button:not(.estira), a:not(.estira), input, textarea, select, label')) return;
  desliz = { card: card, id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, dx: 0, activo: false };
});
document.addEventListener('pointermove', ev => {
  const d = desliz;
  if (!d || ev.pointerId !== d.id) return;
  const dx = ev.clientX - d.x0, dy = ev.clientY - d.y0;
  if (!d.activo) {
    if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { desliz = null; return; }
    if (Math.abs(dx) < 12) return;
    d.activo = true;
    d.card.classList.add('item--deslizando');
  }
  d.dx = dx;
  d.card.style.transform = 'translateX(' + dx + 'px)';
  d.card.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / (d.card.offsetWidth || 300)));
});
document.addEventListener('pointerup', ev => {
  const d = desliz;
  desliz = null;
  if (!d || !d.activo || ev.pointerId !== d.id) return;
  ultimoDesliz = { t: Date.now(), card: d.card };
  const ancho = d.card.offsetWidth || 300;
  if (Math.abs(d.dx) < Math.min(110, ancho * 0.33)) { regresarTarjeta(d); return; }
  d.card.classList.remove('item--deslizando');
  d.card.style.transform = 'translateX(' + (d.dx < 0 ? -1 : 1) * ancho * 1.1 + 'px)';
  d.card.style.opacity = '0';
  const seg = d.card.dataset.quitarSeg;
  if (seg) {
    setTimeout(() => { (estado.deslizadas = estado.deslizadas || {})[seg] = 1; cerrarSeguimiento(seg, 'dejar', 'Lo quité de Seguimiento.'); }, 180);
    return;
  }
  const x = buscarDecision(d.card.dataset.quitar);
  setTimeout(() => {
    if (!x) { regresarTarjeta(d); return; }
    (estado.deslizadas = estado.deslizadas || {})[x.id_hilo] = 1;
    corregirPrioridad(x, 'baja', 'La persona lo quitó de Hoy.', 'pri:' + x.id_hilo);
  }, 180);
});
document.addEventListener('pointercancel', () => { const d = desliz; desliz = null; if (d && d.activo) regresarTarjeta(d); });

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.campo === 'nueva-carpeta') { ev.preventDefault(); agregarCarpeta(); return; }
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.campo === 'renombrar') { ev.preventDefault(); ACCIONES['renombrar-listo'](ev.target.dataset); return; }
  if (!estado.hoja) return;
  if (ev.key === 'Escape') { ev.preventDefault(); cerrarHoja(); return; }
  if (ev.key === 'Tab') {
    const f = [...hoja.querySelectorAll('button:not([disabled]), textarea, a[href]')].filter(x => !x.hidden);
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (ev.shiftKey && i <= 0) { ev.preventDefault(); f[f.length - 1].focus(); }
    else if (!ev.shiftKey && i === f.length - 1) { ev.preventDefault(); f[0].focus(); }
  }
});

/* ==========================================================================
   9 · Arranque
   ========================================================================== */
function arrancar(vistaInicial) {
  if (!EN_APPS_SCRIPT) document.documentElement.dataset.modo = 'prueba';
  ir(vistaInicial || 'hoy', { sinFoco: true });
}
if (EN_APPS_SCRIPT && google.script.url) {
  google.script.url.getLocation(l => arrancar(((l && l.parameter) || {}).vista));
} else {
  arrancar(location.hash.slice(1) || (PARAMS.has('primera') ? 'plan' : PARAMS.get('vista')));
  window.addEventListener('hashchange', () => { const v = ALIAS_VISTA[location.hash.slice(1)] || location.hash.slice(1); if (v !== estado.vista && VISTAS_VALIDAS.indexOf(v) >= 0) ir(v); });
}
