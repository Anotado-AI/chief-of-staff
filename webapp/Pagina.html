    const meta = '<p class="dec__meta">' + (x.sinDatos ? '' : quien(false)) + (nombreOrg(false) ? '<span aria-hidden="true">·</span>' + nombreOrg(false) : '') +
      (x.recibido ? '<span class="cifras">' + esc(x.recibido) + '</span>' : '') + boton + '</p>';
    const cabAncha = '<div class="dec__cab">' + avatar + '<div class="dec__cuerpo">' + meta + '<p class="dec__t">' + asunto + '</p>' +
      (x.sinDatos ? '<p class="dec__quien">' + quien(false) + '</p>' : '') +
      (lista && x.texto ? '<p class="dec__x">' + esc(x.texto) + '</p>' : '') + plazo + '</div></div>';
    return filaAncha({ cab: cabAncha, motivo: x.motivo || 'Opus la marcó como prioridad ' + pri.corto.toLowerCase() + '.',
      icono: lista ? 'responder' : (x.sensible ? 'candado' : 'destello-trazo'), titulo: lista ? 'Respuesta lista' : (x.sensible ? 'Lo contestas tú' : 'Lo que recomienda Opus'),
      respuesta: lista ? lista.texto : (x.texto || 'Ábrelo en Gmail y decide.'), lado: acciones, extra: otra + elegirDespues(x) + pie });
  }
  // En el teléfono el borrador se lee antes de dejarlo (dos líneas grises) y el porqué queda a un toque
  const lista = x.opciones.find(o => o.principal && o.texto), abiertoPq = !!estado.abierto['pq:' + clave];
  const borrador = lista && !x.sensible ? '<p class="dec__borrador"><span class="sr">Borrador: </span>' + esc(lista.texto) + '</p>' : '';
  const pq = x.motivo ? '<button class="btn btn--t" data-accion="porque" data-clave="' + esc('pq:' + clave) + '" aria-expanded="' + abiertoPq + '" aria-controls="pqd-' + esc(x.id_hilo) + '"' + foco('porque:pq:' + clave) + '>Por qué</button>' : '';
  const motivo = !x.motivo ? '' : abiertoPq ? '<p class="dec__motivo" id="pqd-' + esc(x.id_hilo) + '">' + esc(x.motivo) + '</p>' : '<div id="pqd-' + esc(x.id_hilo) + '" hidden></div>';
  return '<div class="item" data-quitar="' + esc(x.id_hilo) + '">' + cab + (x.texto ? '<p class="dec__x">' + esc(x.texto) + '</p>' : '') + plazo + motivo + borrador + '<div class="acciones">' + acciones + pq + '</div>' + otra + elegirDespues(x) + pie + '</div>';
}

function extrasDecision(x) {
  let h = '';
  // Un aviso en spam lo saca la persona con un toque (actuar sacar_de_spam): desde la web app el motor no le pone límite
  const uS = estado.ui['spam:' + x.id_hilo] || {};
  if (uS.fase === 'hecho') h += '<span class="fila__s" tabindex="-1"' + foco('msg:spam:' + x.id_hilo) + '>' + esc(uS.texto) + '</span>' + (uS.id_accion ? '<button class="btn btn--t" data-accion="deshacer" data-clave="' + esc('spam:' + x.id_hilo) + '">Deshacer</button>' : '');
  else if (x.enSpam) h += '<button class="btn btn--s" data-accion="sacar-spam" data-hilo="' + esc(x.id_hilo) + '"' + (uS.fase === 'enviando' ? ' disabled' : '') + foco('spam:' + x.id_hilo) + '>' + (uS.fase === 'enviando' ? 'Sacando…' : 'Sacar de spam') + '</button>';
  const uE = estado.ui['ent:' + x.id_hilo] || {}, uC = estado.ui['con:' + x.id_hilo] || {};
  const d = estado.datos.hoy;
  // Lo sensible se confirma uno por uno
  if (x.sensible && x.resumido && (x.sin_leer || uE.fase) && d && !enAutomatico(d)) {
    h += uE.fase === 'hecho' ? (uE.id_accion ? '<button class="btn btn--t" data-accion="deshacer" data-clave="' + esc('ent:' + x.id_hilo) + '"' + foco('msg:ent:' + x.id_hilo) + '>Leído · Deshacer</button>' : '')
      : '<button class="btn btn--t" data-accion="enterado-uno" data-hilo="' + esc(x.id_hilo) + '"' + (uE.fase === 'enviando' ? ' disabled' : '') + foco('ent:' + x.id_hilo) + '>Ya lo vi</button>';
  }
  if (uC.fase === 'hecho') h += uC.id_accion ? '<button class="btn btn--t" data-accion="deshacer" data-clave="' + esc('con:' + x.id_hilo) + '"' + foco('msg:con:' + x.id_hilo) + '>Conservado · Deshacer</button>' : '';
  else if (x.opcional) h += '<button class="btn btn--t" data-accion="conservar" data-hilo="' + esc(x.id_hilo) + '"' + (uC.fase === 'enviando' ? ' disabled' : '') + foco('con:' + x.id_hilo) + '>Conservar</button>';
  // Después: la tarjeta sale de Hoy y regresa en su fecha
  if (x.id_hilo && !x.sinDatos && opcionesDespues().length) h += '<button class="btn btn--t" data-accion="despues" data-hilo="' + esc(x.id_hilo) + '" aria-expanded="' + !!estado.abierto['pos:' + x.id_hilo] + '"' +
    ((estado.ui['pos:' + x.id_hilo] || {}).fase === 'enviando' ? ' disabled' : '') + foco('pos:' + x.id_hilo) + '>Después</button>';
  return h;
}
// Las tres de corregir_juicio(despues), como las calcula el motor: esta tarde a las cinco (a las ocho desde las cuatro;
// desde las siete ya es mañana y no se ofrece), mañana y el lunes a las ocho. En domingo el lunes es mañana.
function opcionesDespues() {
  const t = ahora(), hora = Number(partes(t, { hour: 'numeric', hourCycle: 'h23' }).hour);
  const hoy = partes(t, { weekday: 'long' }).weekday;
  const op = [];
  if (hora < 16) op.push({ clave: 'esta_tarde', etiqueta: 'Esta tarde, 17:00', texto: 'esta tarde a las 17:00' });
  else if (hora < 19) op.push({ clave: 'esta_tarde', etiqueta: 'Hoy, 20:00', texto: 'hoy a las 20:00' });
  op.push({ clave: 'manana', etiqueta: 'Mañana, 8:00', texto: 'mañana a las 8:00' });
  if (hoy !== 'domingo') op.push({ clave: 'lunes', etiqueta: (hoy === 'lunes' ? 'El próximo lunes' : 'El lunes') + ', 8:00', texto: (hoy === 'lunes' ? 'el próximo lunes' : 'el lunes') + ' a las 8:00' });
  return op;
}
function elegirDespues(x) {
  if (!estado.abierto['pos:' + x.id_hilo]) return '';
  return '<p class="dec__pregunta">¿Cuándo vuelve a Hoy?</p><div class="acciones">' + opcionesDespues().map(o => '<button class="btn btn--s" data-accion="despues-ir" data-hilo="' + esc(x.id_hilo) +
    '" data-clave="' + o.clave + '" data-texto="' + esc(o.texto) + '"' + foco('pos:' + o.clave + ':' + x.id_hilo) + '>' + esc(o.etiqueta) + '</button>').join('') + '</div>';
}
function textoOpcional(x) {
  if ((estado.ui['con:' + x.id_hilo] || {}).fase === 'hecho') return 'Lo conservo: no caduca ni se archiva solo.';
  return 'Opcional: sale de Hoy ' + (x.caduca ? diaRelativo(x.caduca) : 'en unos días') + ' si no lo tocas.';
}

// Resumen del día: una línea; lo demás con «Ver más», o completo si así lo pidió la persona. Se lee y se descarta
// «En corto»: con más de una línea, la primera es el titular en negritas, las que empiezan con «- » o «• » son viñetas
// y cada corte de línea se respeta. Una sola línea va como párrafo
function textoResumen(t) {
  const ls = String(t || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (ls.length < 2) return '<p class="resumen__t">' + escSinCorte(t) + '</p>';
  let html = '<p class="resumen__t resumen__tit">' + escSinCorte(ls[0]) + '</p>', vinetas = [];
  const cierra = () => { if (vinetas.length) html += '<ul class="resumen__lista">' + vinetas.map(v => '<li>' + escSinCorte(v) + '</li>').join('') + '</ul>'; vinetas = []; };
  ls.slice(1).forEach(l => { const m = /^[-•]\s+(.+)$/.exec(l); if (m) vinetas.push(m[1]); else { cierra(); html += '<p class="resumen__t resumen__linea">' + escSinCorte(l) + '</p>'; } });
  cierra();
  return html;
}
function pintarResumen(r, x) {
  const clave = 'prop:' + r.id;
  const u = estado.ui[clave] || {};
  if (u.fase === 'hecho') return '';
  const mas = r.evidencia.texto;
  const abierto = x.resumen.largo === 'completo' || !!estado.abierto[clave];
  const ocupado = u.fase === 'enviando' ? ' disabled' : '';
  const hora = r.creada ? horaCorta(r.creada) : '';
  const cuerpo = '<div class="item resumen">' + textoResumen(r.texto) + (mas && abierto ? '<p class="resumen__mas" id="mas-' + esc(r.id) + '">' + escSinCorte(mas) + '</p>' : mas ? '<span id="mas-' + esc(r.id) + '" hidden></span>' : '') +
    '<div class="acciones">' + (mas && x.resumen.largo !== 'completo' ? '<button class="btn btn--t" data-accion="porque" data-clave="' + esc(clave) + '" aria-expanded="' + abierto + '" aria-controls="mas-' + esc(r.id) + '"' + foco('mas:' + clave) + '>' +
      (abierto ? 'Ver menos' : 'Ver más') + '</button>' : '') +
    '<button class="btn btn--t" data-accion="visto" data-id="' + esc(r.id) + '"' + ocupado + foco('visto:' + r.id) + '>Ocultar</button></div>' + lineaError(clave) + '</div>';
  return seccion(x.textos.resumen, cuerpo, '', hora, 'cab-resumen', 'grupo--tarjetas');
}

// Todo lo que pide un sí, en una sola tarjeta. «Acepto estas N» va al final, después de leer cada línea, y dice cuántas toma
// Las que toma: abiertas, sin respuesta en curso y con una opción recomendada (las que fallaron vuelven a entrar).
// Lo anterior nunca va en el lote: una propuesta de lo anterior, o con alguna opción que lo toca, se contesta sola
const esDeLoAnterior = p => /^historico:/.test(String(p.objeto || '')) || p.opciones.some(o => o.anterior);
function conRecomendacion(lista) {
  return lista.filter(p => { const f = (estado.ui['prop:' + p.id] || {}).fase; return f !== 'hecho' && f !== 'enviando' && p.recomendada !== null && !esDeLoAnterior(p) && p.opciones.some(o => String(o.id) === String(p.recomendada)); });
}
const sinPrefijoListo = t => mayus(String(t || '').replace(/^Listo[.:]\s*/, ''));
function pintarDecidir(lista, titulo) {
  const t = estado.ui.todo || {};
  // Lo que aceptó el lote sale de la lista y queda en un solo renglón con su Deshacer
  const enLote = t.fase === 'hecho' ? t.claves : [];
  const visibles = lista.filter(p => enLote.indexOf('prop:' + p.id) < 0);
  if (!visibles.length && t.fase !== 'hecho') return '';
  const abiertas = visibles.filter(p => { const f = (estado.ui['prop:' + p.id] || {}).fase; return f !== 'hecho' && f !== 'enviando'; });
  const conRec = conRecomendacion(visibles), sinRec = abiertas.length - conRec.length;
  const todo = conRec.length > 1 ? '<div class="si__todo">' + (sinRec > 0 ? '<p class="fila__s">' + (sinRec === 1 ? 'La otra espera tu respuesta.' : 'Las otras ' + sinRec + ' esperan tu respuesta.') + '</p>' : '') +
    '<button class="btn btn--tinte" data-accion="acepto-todo"' + (t.fase === 'enviando' ? ' disabled' : '') + foco('acepto-todo') + '>' + (t.fase === 'enviando' ? 'Guardando…' : 'Acepto estas ' + conRec.length) + '</button></div>' : '';
  const lote = t.fase === 'hecho' ? '<div class="item fila fila--lote" tabindex="-1"' + foco('msg:todo') + '><div class="fila__txt"><p class="fila__t">' + esc(t.texto) + '</p>' +
      '<ul class="lote">' + t.lineas.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul></div>' +
      (t.ids.length ? '<button class="btn btn--t" data-accion="deshacer-todo"' + (estado.ui['des:todo'] && estado.ui['des:todo'].fase === 'enviando' ? ' disabled' : '') + foco('deshacer:todo') + '>Deshacer</button>' : '') + '</div>' + lineaError('des:todo')
    : t.fase === 'error' ? '<div class="item fila" role="alert" tabindex="-1"' + foco('msg:todo') + '><p class="fila__txt fila__t">' + esc(t.texto) + '</p></div>' : '';
  return '<section class="sec sec--si" aria-labelledby="cab-decidir"><h2 class="sec__cab" id="cab-decidir"><span>' + esc(titulo) + '</span></h2>' +
    '<div class="grupo grupo--mosaico">' + agruparSi(visibles) + lote + '</div>' + todo + '</section>';
}
// Dos propuestas de la misma política van en una sola tarjeta, con el nombre una vez
function agruparSi(lista) {
  const hechos = {};
  return lista.map(p => {
    const pol = p.objeto ? politicaPorId(p.objeto) : null;
    const mismas = pol ? lista.filter(q => q.objeto === p.objeto) : [p];
    if (mismas.length < 2) return lineaSi(p);
    if (hechos[p.objeto]) return '';
    hechos[p.objeto] = 1;
    return '<div class="item si-grupo"><div class="prop">' + mosaico(pol.icono, pol.tono) + '<div><p class="fila__t"><b>' + esc(pol.nombre) + '</b></p>' +
      mismas.map(q => '<div class="si-grupo__linea">' + cuerpoSi(q, pol.nombre) + '</div>').join('') + '</div></div></div>';
  }).join('');
}

// Una línea de la tarjeta: el texto en una línea; al tocarlo, el porqué y los correos
function lineaSi(p) {
  const clave = 'prop:' + p.id;
  const u = estado.ui[clave] || {};
  if (u.fase === 'hecho') return filaHecha(clave, u);
  const pregunta = p.tipo === 'pregunta';
  const icono = pregunta ? 'destello' : p.tipo === 'nivel' ? 'rayo' : iconoDe(p.objeto);
  const tonoL = pregunta || p.tipo === 'nivel' ? 'naranja' : tonoDe(p.objeto);
  return '<div class="item"><div class="prop">' + mosaico(icono, tonoL) + '<div>' + cuerpoSi(p) + '</div></div></div>';
}
// El texto, el porqué, los botones y la caja de «Te lo digo yo». Dentro de una tarjeta de política, sin repetir su nombre
function cuerpoSi(p, nombre) {
  const clave = 'prop:' + p.id;
  const u = estado.ui[clave] || {};
  if (u.fase === 'hecho') return '<div class="fila fila--en-grupo" tabindex="-1"' + foco('msg:' + clave) + '><p class="fila__txt fila__t">' + esc(u.texto) + '</p>' +
    (u.id_accion ? '<button class="btn btn--t" data-accion="deshacer" data-clave="' + esc(clave) + '"' + foco('deshacer:' + clave) + '>Deshacer</button>' : '') + '</div>' + lineaError('des:' + clave);
  const ocupado = u.fase === 'enviando' ? ' disabled' : '';
  const pregunta = p.tipo === 'pregunta';
  // Lo que ya aceptó en Claude: esa opción va primero y la línea dice que falta su toque
  const deToque = p.toque ? p.opciones.find(o => String(o.id) === p.toque.opcion || o.etiqueta === p.toque.opcion) || null : null;
  const rec = deToque || p.opciones.find(o => String(o.id) === String(p.recomendada)) || null;
  const otras = p.opciones.filter(o => o !== rec);
  const btn = (o, cls) => '<button class="btn ' + cls + '" data-accion="responder" data-id="' + esc(p.id) + '" data-op="' + esc(String(o.id)) + '"' + ocupado + foco('resp:' + p.id + ':' + o.id) + '>' + esc(o.etiqueta) + '</button>';
  const tuyo = '<button class="btn btn--t" data-accion="otra-respuesta" data-id="' + esc(p.id) + '" aria-expanded="' + !!estado.abierto['otra:' + p.id] + '" aria-controls="otra-' + esc(p.id) + '"' + ocupado + foco('otra-resp:' + p.id) + '>Te lo digo yo</button>';
  let acciones = rec ? btn(rec, 'btn--tinte') : '', mas = '';
  if (rec && otras.length > 1) {
    const abiertoMas = !!estado.abierto['mas:' + p.id];
    acciones += '<button class="btn btn--t" data-accion="mas" data-id="' + esc(p.id) + '" aria-expanded="' + abiertoMas + '"' + ocupado + foco('mas:' + p.id) + '>Otra</button>';
    if (abiertoMas) mas = '<div class="acciones">' + otras.map(o => btn(o, 'btn--s')).join('') + (pregunta ? tuyo : '') + '</div>';
  } else acciones += otras.map(o => btn(o, 'btn--s')).join('') + (pregunta ? tuyo : '');
  const ev = p.evidencia, abierto = !!estado.abierto[clave];
  const porque = ev.texto || ev.ejemplos.length;
  const prefijo = nombre ? new RegExp('^' + nombre.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ':\\s*', 'i') : null;
  const textoP = prefijo && prefijo.test(p.texto) ? escSinCorte(mayus(p.texto.replace(prefijo, ''))) : conPrefijo(p.texto);
  const linea = porque ? '<button class="linea-si" data-accion="porque" data-clave="' + esc(clave) + '" aria-expanded="' + abierto + '" aria-controls="pq-' + esc(p.id) + '"' + foco('porque:' + clave) + '>' + textoP + '</button>'
    : '<p class="fila__t">' + textoP + '</p>';
  const detalle = porque && !abierto ? '<div id="pq-' + esc(p.id) + '" hidden></div>' : porque ? '<div id="pq-' + esc(p.id) + '">' + (ev.texto ? '<p class="fila__s">' + escSinCorte(ev.texto) + '</p>' : '') + (ev.ejemplos.length ? listaEjemplos('ej-' + p.id, ev.ejemplos) : '') + '</div>' : '';
  const texto = estado.otra[p.id] || '';
  const campo = estado.abierto['otra:' + p.id] ? '<div class="campo pedir respuesta"><label class="sr" for="otra-' + esc(p.id) + '">Tu respuesta a: ' + esc(p.texto) + '</label>' +
    '<textarea id="otra-' + esc(p.id) + '" data-campo="otra" data-id="' + esc(p.id) + '" data-min="44" placeholder="Escríbelo como se lo dirías a una persona">' + esc(texto) + '</textarea>' +
    '<div class="perfil__pie"><span class="estado"></span><button class="btn btn--p" data-accion="responder-texto" data-id="' + esc(p.id) + '"' + (texto.trim() ? '' : ' hidden') + ocupado + foco('enviar:' + p.id) + '>Enviar</button></div></div>' : '<div id="otra-' + esc(p.id) + '" hidden></div>';
  const toque = p.toque ? '<p class="fila__s">Lo aceptaste en Claude. Con tu toque aplico lo que falta' + (p.toque.que ? ': ' + escSinCorte(minus(p.toque.que)) : '') + '.</p>' : '';
  return linea + detalle + toque + '<div class="acciones">' + acciones + '</div>' + mas + campo + lineaEnviando(u) + lineaError(clave);
}

// Una lectura opcional que falló: la sección no desaparece, dice desde cuándo
const desdeCuando = f => diferenciaDias(f) === 0 ? 'las ' + horaCorta(f) : cuandoCorto(f);
function lineaNoLeida(texto, reintentar) {
  return '<div class="item fila" role="status">' + mosaico('alerta', 'neutro') + '<p class="fila__txt fila__t">' + esc(texto) + '</p>' +
    (reintentar ? '<button class="btn btn--t" data-accion="recargar" data-vista="hoy"' + foco('releer:' + reintentar) + '>Reintentar</button>' : '') + '</div>';
}

function pintarAgendaHoy(a, titulo) {
  if (!a || a.apagada || !encendida('juntas')) return '';
  if (a.noLeido) return seccion(titulo, lineaNoLeida('No pude leer tu agenda desde ' + desdeCuando(a.noLeido) + '.', 'agenda'), '', '', 'cab-agenda');
  if (a.sin_permiso) return seccion(titulo, lineaNoLeida('No tengo permiso para leer tu calendario.'), '', '', 'cab-agenda');
  return a.eventos.length ? seccion(titulo, pintarAgenda(a.eventos), '', '', 'cab-agenda') : '';
}

function pintarAgenda(eventos) {
  let html = '';
  eventos.forEach((e, i) => {
    if (i > 0 && !e.pasada && eventos[i - 1].pasada) html += '<div class="ahora" aria-hidden="true">' + esc(horaCorta(ahora())) + '</div>';
    html += '<div class="item evento' + (e.pasada ? ' evento--pasado fila--pasada' : '') + '"><div class="evento__hora">' + esc(e.hora) + (e.fin ? '<small>' + esc(e.fin) + '</small>' : '') + '</div>' +
      '<span class="evento__barra" aria-hidden="true"></span><div class="evento__txt"><p class="fila__t"><b>' + esc(e.titulo) + '</b>' + (e.pasada ? '<span class="sr">, ya pasó</span>' : '') + '</p>' +
      (e.preparacion ? '<p class="fila__s">' + esc(e.preparacion) + '</p>' : '') + '</div></div>';
  });
  return html;
}

// WhatsApp: los chats de la última lectura buena; si el último intento falló, dice cuándo y por qué
function pintarWhatsapp(w, titulo) {

  }

    return url ? '<a class="item fila fila--enlace" href="' + esc(url) + '" target="_blank" rel="noopener"' + foco('wa:' + c.chat) + '>' + dentro + '<span class="sr">, abre el chat en WhatsApp</span></a>'
      : '<div class="item fila">' + dentro + '</div>';
  }).join(''),
    pie, derecha, 'cab-wa', 'grupo--avatar');
}

// Modo contestar: los borradores uno por uno, con el texto a la vista. Nunca envío nada sin que toques Enviar, y aun
// entonces espero 10 segundos con «Deshacer envío» antes de pedírselo al motor. Abrir en Gmail queda para cambiarlo
function listosPorContestar(d) {
  const ls = (d.listos || []).filter(l => !estado.contestados[l.id_hilo]), C = estado.hoja;
  const i = C && C.primero ? ls.findIndex(l => l.id_hilo === C.primero) : -1;
  return i > 0 ? [ls[i]].concat(ls.slice(0, i), ls.slice(i + 1)) : ls;
}
// Enviar solo se ofrece con el texto a la vista y el id con que el motor lo envía
const puedeEnviarBorrador = l => !!(l.id_accion || l.id_borrador) && !!textoBorrador(l, estado.datos.hoy || {});

/* ---------- Hoy en pantallas (interruptor ?hoy=2) ---------- */
// Hoy en dos o tres pantallas: el riesgo primero, el resumen abierto, una sola lista de lo que te necesita
// por hora límite, las propuestas al final y lo que se consulta plegado. Pinta con las mismas piezas de Hoy
// Hoy en pantallas es la vista de Hoy; ?hoy=1 pinta el Hoy anterior
const HOY2 = !/[?&]hoy=1\b/.test(location.search);

// Lo que vence va primero, lo más próximo arriba. Un día sin hora cuenta hasta el final de ese día.
// Lo que no vence va después, por prioridad y en el orden en que llegó
const PRIORIDAD_HOY2 = { alta: 0, media: 1 };
function limiteHoy2(j) {
  const v = aFecha(j.vence);
  if (!v) return null;
  return tieneHora(j.vence) ? v.getTime() : v.getTime() + 11.9 * 36e5;
}
function porHoraLimite(lista) {
  return lista.map((j, i) => ({ j: j, i: i, v: limiteHoy2(j) }))
    .sort((a, b) => ((a.v === null) - (b.v === null)) || (a.v !== null && b.v !== null ? a.v - b.v : 0) ||
      ((PRIORIDAD_HOY2[a.j.prioridad] ?? 2) - (PRIORIDAD_HOY2[b.j.prioridad] ?? 2)) || (a.i - b.i))
    .map(x => x.j);
}

// El orden que diseña Opus (orden_hoy) manda dentro de las tres pantallas: lo abierto (el resumen, lo que te necesita y
// lo que espera tu sí) arriba en su orden, y lo plegado abajo, también en su orden. Sin orden de Opus, el de la maqueta.
// Lo que Opus no nombra va después, en el orden de la maqueta; el repaso va con lo que espera tu sí
const ORDEN_HOY2 = ['resumen', 'te_necesita', 'decidir', 'agenda', 'whatsapp', 'listos', 'avisos'];
const ABIERTO_HOY2 = ['resumen', 'te_necesita', 'decidir'];
function ordenHoy2(d) {
  const opus = ((d.experiencia || {}).orden_hoy || []).map(k => k === 'repaso' ? 'decidir' : k).filter(k => ORDEN_HOY2.indexOf(k) >= 0);
  return [...new Set(opus.concat(ORDEN_HOY2))];
}

// Una fila plegada: el título, la cuenta y una línea; al tocarla se abre lo que ya pinta Hoy
function plegadoHoy2(clave, icono, tonoP, titulo, cuenta, sub, cuerpo) {
  const k = 'hoy2:' + clave, abierto = !!estado.abierto[k];
  return '<div class="item plegado2' + (abierto ? ' plegado2--abierto' : '') + '">' +
    '<button class="fila plegado2__fila" data-accion="porque" data-clave="' + esc(k) + '" aria-expanded="' + abierto + '" aria-controls="pl2-' + esc(clave) + '"' + foco('plegado:' + clave) + '>' +
    mosaico(icono, tonoP) + '<span class="fila__txt"><span class="fila__t"><b>' + esc(titulo) + '</b>' + (cuenta ? ' · ' + esc(cuenta) : '') + '</span>' +
    (sub ? '<span class="fila__s plegado2__sub">' + esc(sub) + '</span>' : '') + '</span>' + CHEV + '</button>' +
    (abierto ? '<div class="plegado2__cuerpo" id="pl2-' + esc(clave) + '">' + cuerpo + '</div>' : '<div id="pl2-' + esc(clave) + '" hidden></div>') + '</div>';
}

// Lo que pide tu respuesta y no corre prisa, en una fila al final: propuestas, preguntas y el repaso de la semana
function propuestasHoy2(d, t) {
  const cuerpo = pintarDecidir(d.decidir, t.decidir) + (d.repaso ? pintarRepaso(d.repaso, t.repaso) : '');
  if (!cuerpo) return '';
  // La cuenta del título es la misma de «Acepto estas N»: lo que trae la opción que recomienda Opus. Lo demás espera tu respuesta
  const abiertas = pendientesSi(d), propuestas = conRecomendacion(d.decidir).length, preguntas = Math.max(0, abiertas.length - propuestas);
  const repaso = d.repaso && (estado.ui['prop:' + d.repaso.id] || {}).fase !== 'hecho' ? 'el repaso de la semana' : '';
  const titulo = propuestas ? (propuestas === 1 ? '1 cambio espera tu sí' : propuestas + ' cambios esperan tu sí')
    : preguntas ? (preguntas === 1 ? '1 pregunta para ti' : preguntas + ' preguntas para ti') : repaso ? t.repaso : t.decidir;

/* ---------- Tu plan: la instalación en una sola pantalla ----------
   Opus lee el último mes y propone: destino por remitente, carpetas, quién es
   persona u organización, políticas con nivel y lo que no sabe. La persona
   acepta todo o corrige por excepción; luego ve el simulacro y aplica. */
const respuestaPlan = id => estado.plan.respuestas[id] || null;
function carpetaPlan(clave) { const d = estado.datos.plan; return d ? d.carpetas.find(c => c.clave === clave) : null; }
function nombreCarpeta(clave) {
  const c = carpetaPlan(clave);
  const r = c && respuestaPlan(c.id);
  if (!r) return clave;
  if (r.opcion === 'juntar' && r.texto) return nombreCarpeta(r.texto);
  return r.opcion === 'crear' && r.texto ? r.texto : clave;
}
function etiquetaDestino(o) { const id = String(o.id); return id.indexOf('carpeta:') === 0 ? 'Carpeta ' + nombreCarpeta(id.slice(8)) : o.etiqueta; }
function idSeguro(t) { return String(t).replace(/[^A-Za-z0-9_-]/g, '_'); }
function segmentos(nombre, opciones, actual, etiqueta, campo, id) {
  return '<div class="segm' + (opciones.length === 2 ? ' segm--2' : opciones.length === 3 ? ' segm--3' : '') + '" role="radiogroup" aria-label="' + esc(etiqueta) + '">' + opciones.map(o => {
    const rid = idSeguro(nombre + '-' + o.id);
    return '<input type="radio" id="' + rid + '" name="' + esc(nombre) + '" value="' + esc(String(o.id)) + '" data-campo="' + campo + '" data-id="' + esc(id) + '"' +
      (actual !== null && actual !== undefined && String(o.id) === String(actual) ? ' checked' : '') + foco('#' + rid) + '><label for="' + rid + '">' + esc(o.etiqueta) + '</label>';
  }).join('') + '</div>';
}
const marcaCambio = (p, r) => r && (r.opcion !== undefined || r.texto) && (r.opcion !== p.recomendada || r.texto) ? '<p class="rem__cambio">' + ico('lapiz') + 'Lo cambiaste tú</p>' : '';

function filaGrupo(g) {
  const r = respuestaPlan(g.id) || {};
  const id = 'dst-' + idSeguro(g.id);
  return '<div class="item rem rem--plan">' + mono(g.nombre, { org: true }) + '<div class="rem__txt"><p class="fila__t"><b>' + esc(g.nombre) + '</b></p>' +
    (g.cifras ? '<p class="rem__cifras">' + esc(g.cifras) + '</p>' : '') + (g.motivo ? '<p class="rem__rec">' + escSinCorte(g.motivo) + '</p>' : '') + marcaCambio(g.p, r) + '</div>' +
    '<div class="carpeta rem__ctl"><label for="' + id + '">Destino<span class="sr"> de ' + esc(g.nombre) + '</span></label><select id="' + id + '" data-campo="plan" data-id="' + esc(g.id) + '"' + foco('#' + id) + '>' +
    g.p.opciones.map(o => '<option value="' + esc(String(o.id)) + '"' + (String(o.id) === String(r.opcion) ? ' selected' : '') + '>' + esc(etiquetaDestino(o)) + '</option>').join('') + '</select></div></div>';
}

// Carpetas que detectó Opus: se marcan o desmarcan, se renombran, se juntan o se agrega una propia. Sin tope;
// la que pide la persona no cuenta para la cobertura
const opcionCarpeta = c => (respuestaPlan(c.id) || {}).opcion || (c.recomendada ? 'crear' : 'no');
// Cuántas quedan y qué parte de lo no importante ordenan; una carpeta juntada cuenta si su destino sigue marcado
function coberturaCarpetas(d) {
  const viva = c => opcionCarpeta(c) === 'crear';
  const deOpus = c => viva(c) && !c.propia;
  const ordena = c => {
    if (c.propia) return false;
    if (opcionCarpeta(c) !== 'juntar') return viva(c);
    const t = d.carpetas.find(x => x.clave === (respuestaPlan(c.id) || {}).texto);
    return !!t && viva(t);
  };
  const correos = d.carpetas.filter(ordena).reduce((t, c) => t + c.correos, 0);
  return { n: d.carpetas.filter(deOpus).length, pct: d.no_importante ? Math.min(100, Math.round(correos / d.no_importante * 100)) : null };
}

function filaCarpeta(c) {
  const r = respuestaPlan(c.id) || { opcion: opcionCarpeta(c), texto: '' };
  const marcada = r.opcion !== 'no';
  const renombrando = !!estado.plan.renombrar[c.id];
  const visible = r.opcion === 'crear' && r.texto ? r.texto : c.nombre;
  const mid = 'mc-' + idSeguro(c.id), sel = 'carp-' + idSeguro(c.id);
  const casilla = '<span class="marca__caja"><input type="checkbox" class="marca" id="' + mid + '" data-campo="carpeta-marca" data-id="' + esc(c.id) + '"' + (marcada ? ' checked' : '') +
    foco('#' + mid) + '></span>';
  const nombre = renombrando
    ? '<div class="renombrar"><label class="sr" for="ren-' + idSeguro(c.id) + '">Nuevo nombre de la carpeta ' + esc(c.nombre) + '</label><input id="ren-' + idSeguro(c.id) + '" class="renombrar__campo" data-campo="renombrar" data-id="' + esc(c.id) + '" value="' + esc(visible) + '" maxlength="40" autocomplete="off"' + foco('ren:' + c.id) + '>' +
      '<button class="btn btn--t" data-accion="renombrar-listo" data-id="' + esc(c.id) + '"' + foco('ren-listo:' + c.id) + '>Listo</button></div>'
    : '<p class="fila__t"><label for="' + mid + '"><b>' + esc(visible) + '</b></label></p>';
  const cifras = c.correos ? plural(c.correos, 'correo') + ' de tu último mes' : 'Opus aprende qué va aquí';
  // Juntar: solo con otra carpeta que siga marcada
  const destinos = estado.datos.plan.carpetas.filter(x => x.id !== c.id && opcionCarpeta(x) === 'crear');
  const juntando = r.opcion === 'juntar' || !!estado.plan.juntar[c.id];
  const enlaces = marcada && !renombrando ? [r.opcion === 'crear' && !c.etiqueta ? '<button class="enlace enlace--chico" data-accion="renombrar" data-id="' + esc(c.id) + '" aria-label="Renombrar la carpeta ' + esc(visible) + '"' + foco('renombrar:' + c.id) + '>Renombrar</button>' : '',
    destinos.length && !juntando ? '<button class="enlace enlace--chico" data-accion="juntar" data-id="' + esc(c.id) + '" aria-label="Juntar la carpeta ' + esc(visible) + ' con otra"' + foco('juntar:' + c.id) + '>Juntar con otra</button>' : ''].filter(Boolean) : [];
  const juntar = marcada && destinos.length && juntando ? '<div class="carpeta rem__ctl"><label for="' + sel + '">Juntar con<span class="sr"> la carpeta ' + esc(visible) + '</span></label><select id="' + sel + '" data-campo="carpeta-plan" data-id="' + esc(c.id) + '"' + foco('#' + sel) + '>' +
    '<option value="crear">' + (r.opcion === 'juntar' ? 'No juntarla' : 'Elige una') + '</option>' + destinos.map(x => '<option value="juntar:' + esc(x.clave) + '"' + (r.opcion === 'juntar' && r.texto === x.clave ? ' selected' : '') + '>' + esc(nombreCarpeta(x.clave)) + '</option>').join('') + '</select></div>' : '';
  return '<div class="item rem rem--plan' + (marcada ? '' : ' carpeta--fuera') + '">' + casilla + '<div class="rem__txt">' + nombre + '<p class="rem__cifras">' + esc(cifras) + '</p>' +
    (c.etiqueta ? '<p class="carpeta__tuya">' + ico('etiqueta') + 'Usa tu etiqueta ' + esc(c.etiqueta) + '</p>' : '') +
    (c.motivo ? '<p class="rem__rec">' + esc(c.motivo) + '</p>' : '') +
    (c.ejemplos.length ? '<ul class="ejemplos ejemplos--chico">' + c.ejemplos.map(e => '<li>' + (e.url ? '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.titulo) + '</a>' : esc(e.titulo)) + '</li>').join('') + '</ul>' : '') +
    (enlaces.length ? '<p class="carpeta__enlaces">' + enlaces.join('') + '</p>' : '') + (c.propia ? '' : marcaCambio(c.p, respuestaPlan(c.id))) + '</div>' + juntar + '</div>';
}

function pintarCarpetas(d) {
  const k = coberturaCarpetas(d);
  const cobertura = '<div class="item fila cobertura" role="status">' + mosaico('palomita-circulo', 'verde') + '<p class="fila__txt fila__t">Con ' + (k.n === 1 ? 'esta carpeta' : 'estas ' + k.n + ' carpetas') +
    (k.pct !== null ? ' queda ordenado el <b>' + k.pct + '%</b> de lo que no es importante.' : ' queda ordenado lo que no es importante.') +
    '</p></div>';
  const nueva = estado.plan.nueva || '';
  const agregar = estado.plan.agregando
    ? '<div class="item rem rem--plan"><span class="marca__caja">' + mosaico('mas', 'naranja') + '</span><div class="rem__txt"><div class="renombrar"><label class="sr" for="nueva-carpeta">Nombre de tu carpeta</label>' +
      '<input id="nueva-carpeta" class="renombrar__campo" data-campo="nueva-carpeta" value="' + esc(nueva) + '" maxlength="40" autocomplete="off" placeholder="Nombre de tu carpeta"' + foco('nueva-carpeta') + '>' +
      '<button class="btn btn--t" data-accion="agregar-carpeta-listo"' + (estado.ui['nueva-carpeta'] && estado.ui['nueva-carpeta'].fase === 'enviando' ? ' disabled' : '') + foco('agregar-listo') + '>Agregar</button></div>' +
      lineaEnviando(estado.ui['nueva-carpeta'] || {}) + lineaError('nueva-carpeta') + '</div></div>'
    : '<div class="item fila">' + mosaico('mas', 'naranja') + '<button class="enlace fila__txt fila__t agregar" data-accion="agregar-carpeta"' + foco('agregar-carpeta') + '>Agregar una carpeta</button></div>';
  // Respaldo mientras el motor no acepta la propuesta de la persona: se pidió con pedir_politica y se ve igual que una carpeta propia
  const pedidas = d.pedidas.map(x => '<div class="item rem rem--plan carpeta--pedida"><span class="marca__caja"><input type="checkbox" class="marca" checked disabled aria-label="' + esc(x.nombre) + ': la pediste tú"></span>' +
    '<div class="rem__txt"><p class="fila__t"><b>' + esc(x.nombre) + '</b></p><p class="rem__cifras">Opus aprende qué va aquí</p></div></div>').join('');
  return seccion('Tus carpetas', cobertura + d.carpetas.map(filaCarpeta).join('') + pedidas + agregar,
    'Las nuevas van dentro de «Chief of Staff», para no llenar tu barra lateral.', '', 'cab-carpetas');
}

function filaFichaPlan(f) {
  const r = respuestaPlan(f.id) || {};
  return '<div class="item fila fila--arriba quien">' + mono(f.nombre, { org: r.opcion === 'organizacion' }) + '<div class="fila__txt"><p class="fila__t"><b>' + esc(f.nombre) + '</b></p>' +
    (f.motivo ? '<p class="fila__s">' + escSinCorte(f.motivo) + '</p>' : '') + segmentos('tipo-' + f.id, f.p.opciones, r.opcion, 'Qué es ' + f.nombre, 'plan', f.id) + marcaCambio(f.p, r) + '</div></div>';
}

// Bajas dice lo que hace en el nivel que se encendería; lo sembrado del catálogo, con la voz de la página
function textoPlanPolitica(x, r) {
  if (x.clave !== 'bajas') return vozCatalogo(x.texto);
  const n = r.opcion && r.opcion !== 'apagado' ? r.opcion : x.p.recomendada;
  return textoBajas(n);
}
// Opus dice el nivel dentro de su frase («las mando a su carpeta y te aviso»); la persona solo dice sí o no
function filaPoliticaPlan(x) {
  const r = respuestaPlan(x.id) || {};
  const si = (r.opcion || x.p.recomendada || 'apagado') !== 'apagado';
  const mid = 'ps-' + idSeguro(x.id);
  return '<div class="item rem rem--plan plan-pol"><span class="marca__caja"><input type="checkbox" class="marca" id="' + mid + '" data-campo="plan-si" data-id="' + esc(x.id) + '"' + (si ? ' checked' : '') + foco('#' + mid) + '></span>' +
    '<div class="rem__txt"><p class="fila__t"><label for="' + mid + '"><b>' + esc(x.nombre) + '</b></label></p><p class="fila__s">' + escSinCorte(textoPlanPolitica(x, r)) + '</p>' +
    (x.ejemplo ? '<p class="rem__rec">' + escSinCorte(x.ejemplo) + '</p>' : '') +
    (x.clave === 'juntas' ? '<p class="fila__s">Al encenderla te pide permiso para leer tu calendario. Nunca lo cambia.</p>' : '') + marcaCambio(x.p, r) + '</div></div>';
}

// Las tres decisiones de la persona, ya marcadas con la recomendación y una línea de porqué
function filaDecisionPlan(q) {
  const r = respuestaPlan(q.id) || {};
  const actual = r.opcion !== undefined ? r.opcion : q.p.recomendada;
  const o = q.p.opciones.find(x => String(x.id) === String(actual));
  const rec = o && String(o.id) === String(q.p.recomendada);
  return '<div class="item plan-pol plan-dec"><p class="fila__t"><b>' + esc(q.titulo) + '</b></p>' + segmentos('dec-' + q.id, q.p.opciones, actual, q.titulo, 'plan', q.id) +
    (o && o.porque ? '<p class="fila__s plan-dec__porque">' + (rec ? '<b>Opus lo recomienda.</b> ' : '') + escSinCorte(o.porque) + '</p>' : '') + marcaCambio(q.p, r) + '</div>';
}

// Lo leído anterior a una fecha: alcance aparte, con su propio sí. Nadie lo revisó uno por uno, y la página lo dice
// Lo viejo de la bandeja: un botón por opción de Opus, en su orden y sin ninguno marcado (la recomendación va en su texto).
// Cada opción con modo (archivar lo leído, marcar leído lo sin leer o las dos) dice debajo qué hace, con sus cifras.
// Va con su propio sí, fuera de «Acepto todo»
// Una cifra que el motor marca aproximada (más de 3,000 hilos): redondeada y dicha como tal, «unos 17 mil»
function cifraAprox(v) {
  const x = Number(v) || 0;
  if (x >= 1000) return 'unos ' + separarMiles(Math.round(x / 1000)) + ' mil';
  if (x >= 100) return 'unos ' + separarMiles(Math.round(x / 100) * 100);
  return 'unos ' + separarMiles(x);
}
function efectoModo(m) {
  if (m.modo === 'leido') return 'Marco leído lo sin leer. Se queda en tu bandeja.';
  if (m.modo === 'ambos') return 'Archivo lo leído y marco leído lo sin leer, que se queda en tu bandeja.';
  return 'Archivo lo leído. Lo sin leer se queda como está.';
}
// El título dice solo la fecha: ninguna cifra, ni lo que se archiva, ni lo que se queda, ni el total de lo anterior
function tituloHistorico(x) {
  return 'Lo anterior al ' + diaDeMes(x.fecha);
}
function filaHistorico(x) {
  const clave = 'prop:' + x.id, u = estado.ui[clave] || {};
  if (u.fase === 'hecho') return filaHecha(clave, u);
  const p = x.p, ocupado = u.fase === 'enviando' ? ' disabled' : '';
  const atrib = o => ' data-accion="responder" data-id="' + esc(p.id) + '" data-op="' + esc(String(o.id)) + '"' + ocupado + foco('resp:' + p.id + ':' + o.id);
  const btn = (o, cls) => '<button class="btn ' + cls + '"' + atrib(o) + '>' + esc(o.etiqueta) + '</button>';
  const modos = x.modos || [];
  const soloArchivar = modos.every(m => m.modo === 'archivar');
  const titulo = tituloHistorico(x);
  let botones;
  // Lo anterior lo decide la persona: «Déjalo como está» va primero y archivar (solo o con marcar leído)
  // nunca va recomendado ni como el botón destacado. Marcar leído lo sin leer sí puede llevar la recomendación de Opus
  if (modos.length) {
    const recModo = (modos.find(m => String(m.o.id) === String(p.recomendada)) || {}).modo;
    const dejar = p.opciones.filter(o => !modos.some(y => y.o === o));
    botones = '<div class="hist__ops">' + dejar.concat(p.opciones.filter(o => dejar.indexOf(o) < 0)).map(o => {
      const m = modos.find(y => y.o === o);
      const rec = !!m && recModo === 'leido' && String(o.id) === String(p.recomendada);
      return m ? '<button class="hist__op' + (rec ? ' hist__op--rec' : '') + '"' + atrib(o) + '><span class="hist__op-t">' + esc(o.etiqueta) + (rec ? ' · Opus lo recomienda' : '') + '</span><span class="hist__op-s">' + esc(efectoModo(m)) + '</span></button>'
        : '<button class="hist__op"' + atrib(o) + '><span class="hist__op-t">' + esc(dejar.length === 1 ? 'Déjalo como está' : o.etiqueta) + '</span><span class="hist__op-s">Nada cambia en tu correo.</span></button>';
    }).join('') + '</div>';
  } else {
    // Sin modos reconocibles (opciones sin efecto): primero la que deja todo como está; ninguna que archive va marcada
    const dejar = p.opciones.filter(o => /^(no\b|dejar|déjal|deja )/i.test(o.etiqueta));
    const rec = p.opciones.find(o => String(o.id) === String(p.recomendada) && !/archiv/i.test(o.etiqueta) && dejar.indexOf(o) < 0) || null;
    botones = '<div class="acciones">' + dejar.map(o => btn(o, 'btn--s')).join('') + (rec ? btn(rec, 'btn--tinte') : '') + p.opciones.filter(o => o !== rec && dejar.indexOf(o) < 0).map(o => btn(o, 'btn--s')).join('') + '</div>';
  }
  const aviso = soloArchivar ? 'Opus no lo revisa uno por uno. Si eliges archivar, archivo solo lo leído, sin estrella ni borrador. Lo sin leer se queda. Se deshace desde Hoy o desde Actividad.'
    : 'Opus no lo revisa uno por uno. Nunca archivo algo sin leer. Lo que tiene estrella, borrador o algo pendiente se queda como está. Se deshace desde Hoy o desde Actividad.';
  return '<div class="item plan-pol plan-hist"><div class="fila fila--arriba">' + mosaico('archivo', 'azul') + '<div class="fila__txt"><p class="fila__t"><b>' + esc(titulo) + '</b></p>' +
    (p.texto ? '<p class="fila__s">' + escSinCorte(p.texto) + '</p>' : '') + (/se queda en Recibidos/i.test(p.texto || '') ? '' : '<p class="fila__s">Lo sin leer se queda en Recibidos.</p>') + '<p class="fila__s">' + aviso + '</p></div></div>' +
    '<div class="hist__ctl">' + botones + lineaEnviando(u) + lineaError(clave) + '</div></div>';
}

// Cómo trabaja Opus para la persona (su Hoy, sus horas de revisión): una línea del plan con su sí o «Cambiar en palabras»
function filaTrabajoPlan(q) {
  const r = respuestaPlan(q.id) || {};
  const actual = r.opcion !== undefined ? r.opcion : q.p.recomendada;
  const libre = /palabras|te lo digo|otra/i.test(String((q.p.opciones.find(o => String(o.id) === String(actual)) || {}).etiqueta || ''));
  const tid = 'trab-' + idSeguro(q.id);
  return '<div class="item plan-pol"><div class="fila fila--arriba">' + mosaico(q.clave === 'rutinas' ? 'reloj' : 'destello', q.clave === 'rutinas' ? 'azul' : 'naranja') +
    '<div class="fila__txt"><p class="fila__t">' + escSinCorte(q.p.texto) + '</p></div></div>' + segmentos('trab-' + q.id, q.p.opciones, actual, q.p.texto, 'plan', q.id) +
    (libre ? '<div class="campo pedir"><label class="sr" for="' + tid + '">Qué cambio</label><textarea id="' + tid + '" data-campo="plan-texto" data-id="' + esc(q.id) + '" data-min="44" placeholder="Escribe qué cambiarías, como se lo dirías a una persona"' + foco('#' + tid) + '>' + esc(r.texto || '') + '</textarea></div>' : '') +
    marcaCambio(q.p, r) + '</div>';
}

// Las dudas de Opus traen su recomendada: va primero y marcada, y «Acepto todo» la toma. Sin recomendada, nada marcado y se queda abierta
const recomendadaDe = p => p.opciones.find(o => String(o.id) === String(p.recomendada)) || null;
function filaPreguntaPlan(q) {
  const r = respuestaPlan(q.id) || {};
  const rec = recomendadaDe(q.p);
  const opciones = rec ? [rec].concat(q.p.opciones.filter(o => o !== rec)) : q.p.opciones;
  return '<div class="item plan-pol"><div class="fila fila--arriba">' + mosaico('destello', 'naranja') + '<div class="fila__txt"><p class="fila__t"><b>' + esc(q.p.texto) + '</b></p>' +
    (q.p.evidencia.texto ? '<p class="fila__s">' + escSinCorte(q.p.evidencia.texto) + '</p>' : '') + '</div></div>' + segmentos('preg-' + q.id, opciones, r.opcion, q.p.texto, 'plan', q.id) + marcaCambio(q.p, r) + '</div>';
}
function piePreguntas(d) {
  return 'Lo marcado es lo que Opus te recomienda. «Acepto todo» lo toma' + (d.preguntas.some(q => !recomendadaDe(q.p)) ? '; lo que no tiene marca te lo pregunto después.' : '.');
}

/* ---------- El plan por lineamientos ---------- */
// Arriba, el resultado con lo abierto que quedaría escondido: [Déjalo a la vista] cambia la respuesta de su remitente
function filaEscondido(a) {
  const p = a.propuesta && estado.datos.plan.todas.find(y => y.id === a.propuesta);
  const quedar = p && opcionImportante(p);
  const r = p && respuestaPlan(p.id);
  const vista = quedar && r && String(r.opcion) === String(quedar.id);
  const que = [a.remitente, a.asunto, a.fecha ? 'lo abriste el ' + diaDeMes(claveDia(a.fecha)) : ''].filter(Boolean).join(' · ');
  return '<div class="fila lin__escondido"><p class="fila__txt fila__s">' + esc(que) + '</p>' + (!quedar ? '' : vista
    ? '<span class="fila__s lin__vista">' + PALOMITA + 'A la vista</span><button class="btn btn--t btn--chico" data-accion="lin-escondido" data-id="' + esc(p.id) + '" data-valor="0"' + foco('esc:' + p.id) + '>Deshacer</button>'
    : '<button class="btn btn--t btn--chico" data-accion="lin-escondido" data-id="' + esc(p.id) + '" data-valor="1"' + foco('esc:' + p.id) + '>Déjalo a la vista</button>') + '</div>';
}
function pintarResultado(res) {
  return seccion('', '<div class="item simulacro lin-res"><p class="simulacro__cifras" aria-hidden="true"><span>' + separarMiles(res.antes) + '</span>' + ico('flecha') +
    '<span class="simulacro__despues">' + separarMiles(res.despues) + '</span></p>' +
    '<p class="dec__t">Lo del último mes en tu bandeja pasaría de ' + separarMiles(res.antes) + ' a ' + separarMiles(res.despues) + '.</p>' +
    (res.abiertos.length ? '<p class="fila__s">Lo que abriste y quedaría fuera de tu bandeja:</p>' + res.abiertos.map(filaEscondido).join('') : '') + '</div>', '', '', 'cab-resultado');
}
// Tu gente: quien nunca espera, que la persona ya confirmó en Claude. Su correo siempre se queda en la bandeja
function pintarGente(gente) {
  return seccion('Tu gente', gente.map(f => '<div class="item fila fila--arriba quien">' + mono(f.nombre) + '<div class="fila__txt"><p class="fila__t"><b>' + esc(f.nombre) + '</b></p>' +
    '<p class="fila__s">' + esc([f.relacion || f.rol, f.ultimo_asunto || f.ultima || (f.temas_abiertos || [])[0]].filter(Boolean).join(' · ')) + '</p></div></div>').join('') +
    '<div class="item fila"><p class="fila__txt fila__s">Su correo siempre se queda en tu bandeja.</p><a class="btn btn--t" href="https://claude.ai/new" target="_blank" rel="noopener">Cambiar en Claude</a></div>', '', '', 'cab-gente');
}
// Lo que te pide algo: [Ya lo resolví] lo archiva, con Deshacer. Lo que no marques sale en Hoy desde mañana
function pintarPide(pide) {
  return seccion('Lo que te pide algo', pide.map(j => {
    const clave = 'res:' + j.id_hilo, u = estado.ui[clave] || {};
    if (u.fase === 'hecho') return filaHecha(clave, u);
    return '<div class="item fila fila--arriba">' + mono(j.nombre || j.titulo) + '<div class="fila__txt"><p class="fila__t"><b>' + esc(j.titulo) + '</b></p>' +
      (j.texto ? '<p class="fila__s">' + escSinCorte(j.texto) + '</p>' : '') + (j.plazo ? '<p class="fila__s">' + esc(j.plazo) + '</p>' : '') +
      '<div class="acciones"><button class="btn btn--s" data-accion="ya-resuelto" data-hilo="' + esc(j.id_hilo) + '"' + (u.fase === 'enviando' ? ' disabled' : '') + foco(clave) + '>Ya lo resolví</button></div>' +
      lineaEnviando(u) + lineaError(clave) + '</div></div>';
  }).join(''), 'Lo que no marques sale en Hoy desde mañana.', '', 'cab-pide');
}
// Una regla del lineamiento, con los controles que ya tiene en el plan de hoy
function filaReglaLineamiento(g) {
  if (g.tipo === 'carpeta') return filaCarpeta(g.x) + (/factura|pago/i.test(g.x.nombre) ? '<div class="item fila"><p class="fila__txt fila__s">Si llega una cuenta bancaria nueva, un monto raro, un primer cobro, un pago por vencer o un cargo que no reconoces, te sale en Hoy.</p></div>' : '');
  return g.tipo === 'grupo' ? filaGrupo(g.x) : filaPoliticaPlan(g.x);
}
// «De tus 39 sin leer, 6 te piden algo; los demás los marco leídos»
function fraseSinLeer(x) {
  const n = separarMiles(x.antes), m = x.despues;
  if (!x.antes) return 'No tienes nada sin leer.';
  return (x.antes === 1 ? 'De tu correo sin leer, ' : 'De tus ' + n + ' sin leer, ') + (m ? separarMiles(m) + (m === 1 ? ' te pide algo' : ' te piden algo') + (x.antes > m ? '; los demás los marco leídos.' : '.') : 'ninguno te pide algo; los marco leídos.');
}
function tarjetaLineamiento(L) {
  const r = respuestaPlan(L.p.id) || {};
  const actual = r.opcion !== undefined ? r.opcion : L.p.recomendada;
  const o = L.p.opciones.find(x => String(x.id) === String(actual));
  const rec = o && String(o.id) === String(L.p.recomendada);
  const abierto = !!estado.abierto['lin:' + L.id];
  const bloque = L.sinLeer ? fraseSinLeer(L.sinLeer) : [L.cifra != null ? nCorreos(L.cifra) + ' al mes' : '', L.abiertos != null ? 'abres ' + L.abiertos + ' de cada 100' : ''].filter(Boolean).join(' · ');
  return '<div class="item plan-pol lin" id="lin-' + L.id + '"><h3 class="fila__t lin__nombre">' + esc(L.nombre) + '</h3>' + (L.texto ? '<p class="fila__s">' + escSinCorte(L.texto) + '</p>' : '') +
    (bloque ? '<p class="rem__cifras">' + esc(bloque) + '</p>' : '') +
    (L.ejemplos.length ? '<p class="fila__s lin__ej">' + L.ejemplos.map(e => esc(e.remitente) + (e.cifra != null ? ' ' + separarMiles(e.cifra) : '')).join(' · ') + '</p>' : '') +
    segmentos('lin-' + L.id, L.p.opciones, actual, L.nombre, 'plan', L.p.id) +

function pintarArranque() {

  const bajas = estado.plan.bajasDadas.length;
  const deshacer = bajas ? 'Te di de baja de ' + plural(bajas, 'remitente') + '. Los movimientos se deshacen desde aquí o desde Actividad. Las bajas se revierten en el sitio del remitente.'

  let html = act ? cabecera('Listo', 'Tu Chief of Staff ya trabaja para ti') : cabecera(nada ? 'Tus instrucciones quedaron guardadas' : 'Tus instrucciones quedaron aplicadas', 'Vuelve a Claude para terminar.');
  html += seccion('', '<div class="item" tabindex="-1"' + foco('msg:arranque') + '><div class="dec__cab">' + mosaico('palomita-circulo', 'verde l') + '<div class="dec__cuerpo"><p class="dec__t">' +

    (escrito ? '<p class="dec__quien">' + TEXTO_LIBRE_ANOTADO + '</p>' : '') + '</div></div>' +
    (a.id_accion ? '<div class="acciones"><button class="btn btn--t" data-accion="deshacer-plan"' + foco('deshacer:plan') + '>Deshacer</button></div>' : '') + lineaError('des:plan') + '</div>', '', '', '', 'grupo--tarjetas');
  if (!act) return html + '<div class="barra-accion"><button class="btn btn--s btn--grande" data-accion="ir" data-vista="hoy"' + foco('ir-hoy') + '>Ir a Hoy</button></div>';

  return html + '<div class="barra-accion"><button class="btn btn--p btn--grande" data-accion="ir" data-vista="hoy"' + foco('ir-hoy') + '>Ir a Hoy</button></div>';
}

async function cerrarAplicar() {
  const P = estado.plan;
  // «Ya trabaja para ti» solo con la activación que confirma el motor
  try { P.activacion = (await pedir('ver_hoy', {})).activacion || null; } catch (e) { P.activacion = null; }
  P.fase = 'listo';
  delete estado.ui.aplicar;
  window.scrollTo(0, 0);
  estado.focoSiguiente = 'msg:arranque';
  anunciar(P.aplicado && P.aplicado.sinReglas ? 'Tus instrucciones quedaron guardadas; no hubo nada que mover.' : P.activacion ? 'Listo. Apliqué tus instrucciones.' : 'Tus instrucciones quedaron aplicadas. Vuelve a Claude para terminar.');
}

async function enTandas(lista, n, f) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, lista.length) }, async () => { while (i < lista.length) { const x = lista[i++]; await f(x); } }));
}
function avisarProgreso(texto) {
  estado.plan.progreso = texto;
  const b = principal.querySelector('[data-accion="aceptar-plan"], [data-accion="aplicar-plan"]');
  if (b) b.textContent = texto;
}

async function aceptarPlan() {
  const d = estado.datos.plan, P = estado.plan;
  // Solo se manda lo que falta o lo que cambió desde la última respuesta
  const porMandar = d.todas.filter(p => {
    const r = P.respuestas[p.id];
    if (!r) return false;
    return p.estado === 'abierta' || !p.respuesta || p.respuesta.opcion !== r.opcion || (p.respuesta.texto || '') !== (r.texto || '');
  });
  // Un lineamiento que la persona cambió manda sobre sus reglas: de esas solo van las que ella misma tocó
  const cambiado = {};
  (d.lineamientos || []).forEach(L => { const r = P.respuestas[L.p.id]; if (r && L.p.recomendada != null && String(r.opcion) !== String(L.p.recomendada)) cambiado[L.id] = 1; });
  const tocada = p => { const r = P.respuestas[p.id]; return !!r && (String(r.opcion) !== String(p.recomendada) || !!r.texto); };
  // Un lineamiento sin recomendada lo elige la persona: mientras no elija, sus reglas tampoco van
  (d.lineamientos || []).forEach(L => { if (L.p.recomendada == null && !P.respuestas[L.p.id]) cambiado[L.id] = 1; });
  // Una decisión dentro de un lineamiento (seguridad en al_dia) no depende de su opción: va siempre
  const mandables = porMandar.filter(p => esLineamiento(p) || /^decision:/.test(String(p.objeto || '')) || !cambiado[p.lineamiento] || tocada(p));
  // Primero las carpetas: los destinos de los remitentes usan sus nombres. Los lineamientos al final y en su orden:
  // el sexto pone el nivel de las reglas que quedaron prendidas
  const carpetas = mandables.filter(p => String(p.objeto).indexOf('carpeta:') === 0);
  const lins = mandables.filter(esLineamiento).sort((a, b) => LINEAMIENTOS.indexOf(a.lineamiento) - LINEAMIENTOS.indexOf(b.lineamiento));
  const resto = mandables.filter(p => carpetas.indexOf(p) < 0 && lins.indexOf(p) < 0);
  estado.ui.plan = { fase: 'enviando' };
  P.progreso = 'Guardando tus instrucciones…';
  pintar();
  try {
    let hechas = 0;
    const mandar = async p => {
      const r = P.respuestas[p.id];
      await pedir('responder', Object.assign({ id: p.id }, aMotorPlan(p, r)));
      p.estado = 'aceptada';
      p.respuesta = { opcion: r.opcion, texto: r.texto || '' };
      avisarProgreso('Guardando tus instrucciones… ' + (++hechas) + ' de ' + mandables.length);
    };
    await enTandas(carpetas, 6, mandar);
    await enTandas(resto, 6, mandar);
    for (const p of lins) await mandar(p);
    // Segunda defensa: el nivel general (cuanto_hago_solo) no prende una regla que la persona dejó en su bandeja.
    // Solo a las que no quedaron apagadas, para no llenar Actividad de líneas sin cambio
    const quedan = reglasQueSeQuedan(d);
    if (quedan.length) {
      const vp = await pedir('ver_politicas', {});
      const nivel = id => ((vp.politicas || []).find(x => x.id === id) || {}).nivel;
      for (const id of quedan.filter(id => nivel(id) && nivel(id) !== 'apagado')) await pedir('cambiar_politica', { id: id, nivel: 'apagado' });
    }
    avisarProgreso('Calculando cómo quedaría…');
    P.simulacro = await simularTodo(d.dias, n => avisarProgreso('Calculando cómo quedaría… ' + nCorreos(n)));
    P.fase = 'simulacro';
    delete estado.ui.plan;
    window.scrollTo(0, 0);
    estado.focoSiguiente = 'msg:simulacro';
    anunciar('Listo. Tu bandeja pasaría de ' + P.simulacro.antes + ' a ' + P.simulacro.despues + ' correos.');
  } catch (e) {
    estado.ui.plan = { fase: 'error', texto: textoError(e, 'No pude guardar tus instrucciones.'), reintentar: aceptarPlan };
    estado.focoSiguiente = 'reintentar:plan';
  }
  pintar();
}

// Las reglas que el nivel general prendería y que la persona dejó en su bandeja: alguna respuesta del plan
// (un lineamiento o un grupo) podía prenderlas y la que eligió no lo hace, y ninguna otra respuesta suya las prende
function reglasQueSeQuedan(d) {
  const elegida = p => p.respuesta ? p.opciones.find(o => String(o.id) === String(p.respuesta.opcion) || o.etiqueta === p.respuesta.opcion) || null : null;
  const general = d.todas.find(p => esLineamiento(p) && p.lineamiento === 'cuanto_hago_solo');
  const og = general && general.estado !== 'abierta' ? elegida(general) : null;
  if (!og) return [];
  const tocadas = {}, prendidas = {};
  d.todas.filter(p => p !== general).forEach(p => {
    p.opciones.forEach(o => (o.reglas || []).forEach(g => { tocadas[g.id] = 1; }));
    const o = p.estado === 'aceptada' || p.estado === 'corregida' ? elegida(p) : null;
    (o && o.reglas || []).filter(g => g.nivel !== 'apagado').forEach(g => { prendidas[g.id] = 1; });
  });
  return [...new Set((og.reglas || []).filter(g => g.nivel !== 'apagado' && tocadas[g.id] && !prendidas[g.id]).map(g => g.id))];
}

// Una carpeta propia entra al plan como propuesta de la persona; se crea al aceptar el plan
async function agregarCarpeta() {
  const nombre = (estado.plan.nueva || '').trim().replace(/\s+/g, ' ');
  const d = estado.datos.plan;
  if (!nombre || !d) return;
  const igual = x => sinAcentos(x).toLowerCase() === sinAcentos(nombre).toLowerCase();
  if (d.carpetas.some(c => igual(c.nombre) || igual(nombreCarpeta(c.clave))) || d.pedidas.some(x => igual(x.nombre))) {
    estado.ui['nueva-carpeta'] = { fase: 'error', texto: 'Ya tienes una carpeta con ese nombre.' };
    estado.focoSiguiente = 'nueva-carpeta';
    pintar();
    return;
  }
  estado.ui['nueva-carpeta'] = { fase: 'enviando' };
  pintar();
  try {
    let r = null;
    try {
      r = await pedir('proponer', { datos: { tipo: 'plan', lote: 'instalacion', origen: 'persona', objeto: 'carpeta:' + nombre, nombre: nombre, texto: nombre,
        evidencia: { cifra: 0, ejemplos: [] }, recomendada: 'Crear',
        opciones: [{ id: 'Crear', etiqueta: 'Crear', efecto: { politica: { nombre: nombre, texto: 'Carpeta «' + nombre + '» que pediste. Opus decide qué va ahí.', acciones: ['carpeta:' + nombre], nivel: 'propone' }, usar_texto_como: 'carpeta' } },
          { id: 'No', etiqueta: 'No', efecto: null }] } });
    } catch (e) { r = null; }
    // Respaldo: si el motor todavía no acepta la carpeta de la persona, se le pide a Opus con pedir_politica. Para la persona se ve igual
    const entro = !!r && !r.rechazada;
    if (!entro) await pedir('pedir_politica', { texto: 'Quiero una carpeta «' + nombre + '».' });
    estado.plan.agregando = false;
    estado.plan.nueva = '';
    delete estado.ui['nueva-carpeta'];
    estado.focoSiguiente = 'agregar-carpeta';
    anunciar('Agregué ' + nombre + '.');
    cargar('plan');
  } catch (e) {
    estado.ui['nueva-carpeta'] = { fase: 'error', texto: textoError(e, 'No pude agregarla.'), reintentar: agregarCarpeta };
    estado.focoSiguiente = 'reintentar:nueva-carpeta';
  }
  pintar();
}

// Lo que se manda al motor: en una carpeta, su etiqueta (Crear o No); juntar es Crear con el nombre de la otra carpeta
function aMotorPlan(p, r) {
  // El motor reconoce la opción por su etiqueta; si Opus le dio id a una opción, se manda su etiqueta
  const etiqueta = x => { const o = p.opciones.find(y => y.id !== undefined && String(y.id) === String(x) && y.etiqueta); return o ? o.etiqueta : x; };
  if (!p.aMotor) return { opcion: etiqueta(r.opcion), texto: r.texto || '' };
  if (r.opcion === 'juntar') return p.juntaConTexto ? { opcion: etiqueta(p.aMotor.crear), texto: nombreCarpeta(r.texto) } : { opcion: etiqueta(p.aMotor.juntar), texto: r.texto };
  return { opcion: etiqueta(p.aMotor[r.opcion] !== undefined ? p.aMotor[r.opcion] : r.opcion), texto: r.texto || '' };
}
// La opción de dejar un remitente en la bandeja, la llame como la llame Opus. En un plan real:
// «Importante», «Se queda en mi bandeja», «Todo me importa: en mi bandeja» y «Dejarlo como está»
const QUEDARSE = [/^importante$/i, /se queda/i, /bandeja/i, /como est[aá]/i];
const opcionImportante = p => p.opciones.find(o => o.id === 'importante') || QUEDARSE.map(rx => p.opciones.find(o => rx.test(o.etiqueta))).find(Boolean) || null;

async function queSeQuede(id_hilo, idPropuesta) {
  const clave = 'rev:' + id_hilo, P = estado.plan;
  const p = estado.datos.plan.todas.find(x => x.id === idPropuesta);
  if (!p) return;
  const antes = P.respuestas[p.id];
  const quedar = opcionImportante(p).id;
  estado.ui[clave] = { fase: 'enviando' };
  pintar();
  try {
    // El plan ya está aceptado: el motor cambia la respuesta mientras no se aplique, y el simulacro y aplicar usan la nueva
    P.respuestas[p.id] = { opcion: quedar, texto: '' };
    const r = await pedir('responder', Object.assign({ id: p.id }, aMotorPlan(p, P.respuestas[p.id])));
    p.respuesta = { opcion: quedar, texto: '' };
    if (r && r.estado) p.estado = r.estado;
    P.simulacro = await simularTodo(estado.datos.plan.dias);
    delete estado.ui[clave];
    estado.focoSiguiente = 'msg:simulacro';
    anunciar('Se queda en tu bandeja. Tu bandeja pasaría a ' + P.simulacro.despues + ' correos.');
  } catch (e) {
    P.respuestas[p.id] = antes;
    estado.ui[clave] = { fase: 'error', texto: textoError(e, 'No pude guardarlo.'), reintentar: () => queSeQuede(id_hilo, idPropuesta) };
    estado.focoSiguiente = 'reintentar:' + clave;
  }
  pintar();
}

// El motor simula por páginas: más de 200 hilos o un 429 cortan la primera. El resumen suma todas las páginas pedidas
// y revisar viene por página. Se sigue hasta que no haya siguiente; si al final no está completo, las cifras son «al menos»
async function simularTodo(dias, alAvanzar) {
  let pagina = 0, r = null, vueltas = 0;
  const revisar = [];
  for (;;) {
    r = await pedir('simular', { lote: 'instalacion', dias: dias, pagina: pagina });
    r.revisar.forEach(x => { if (!revisar.some(y => y.id_hilo === x.id_hilo)) revisar.push(x); });
    if (r.pagina_siguiente === null || r.pagina_siguiente === undefined || r.pagina_siguiente === '' || ++vueltas >= 50) break;
    pagina = r.pagina_siguiente;
    if (alAvanzar) alAvanzar(r.antes);
  }
  if (r.pagina_siguiente) r.completo = false;
  return Object.assign(r, { revisar: revisar });
}
async function resimular() {
  const P = estado.plan;
  estado.ui.resimular = { fase: 'enviando' };
  pintar();
  try {
    P.simulacro = await simularTodo(estado.datos.plan.dias);
    delete estado.ui.resimular;
    estado.focoSiguiente = 'msg:simulacro';
    anunciar(P.simulacro.completo ? 'Simulacro completo.' : 'Todavía faltan correos por leer.');
  } catch (e) {
    estado.ui.resimular = { fase: 'error', texto: textoError(e, 'No pude volver a calcular.'), reintentar: resimular };
  }
  pintar();
}

function textoPendiente(r) {
  return ['No terminé de aplicar tus instrucciones.', r.movidos ? 'Moví ' + nCorreos(r.movidos) + '.' : '',
    r.faltan ? (r.faltan === 1 ? 'Falta 1 que Gmail no dejó leer.' : 'Faltan ' + separarMiles(r.faltan) + ' que Gmail no dejó leer.') : '',
    r.movidos ? 'Lo que ya moví quedó en Actividad, con Deshacer.' : '', 'Reintenta en unos minutos.'].filter(Boolean).join(' ');
}
async function aplicarPlan() {
  const P = estado.plan, d = estado.datos.plan;
  estado.ui.aplicar = { fase: 'enviando' };
  P.fase = 'aplicando';
  P.progreso = 'Aplicando tus instrucciones…';
  pintar();
  try {
    let pagina = 0, r, bajas = [], vueltas = 0;
    for (;;) {
      r = await pedir('aplicar', { lote: 'instalacion', dias: d.dias, pagina: pagina });
      bajas = bajas.concat(r.bajas || []);
      if (r.estado !== 'en_proceso' || r.pagina_siguiente === null) break;
      if (++vueltas >= 100) { r.completo = false; break; }
      pagina = r.pagina_siguiente;
      avisarProgreso('Aplicando tus instrucciones… ' + (r.total ? separarMiles(r.movidos) + ' de ' + separarMiles(r.total) + ' correos' : ''));
    }
    P.aplicado = Object.assign({}, r, { bajas: bajas });
    // El motor da cada baja una sola vez: si se deshace y se vuelve a aplicar, ya no la regresa. La página la recuerda
    bajas.filter(b => b.hecha).forEach(b => { if (!P.bajasDadas.some(x => x.remitente === b.remitente)) P.bajasDadas.push(b); });
    // Mientras aplicar no cubra todo, no hay «Listo»: se dice cuánto quedó pendiente y se ofrece reintentar
    if (!r.completo || r.faltan > 0) {
      P.fase = 'simulacro';
      estado.ui.aplicar = { fase: 'error', texto: textoPendiente(r), reintentar: aplicarPlan };
      estado.focoSiguiente = 'reintentar:aplicar';
      pintar();
      return;
    }
    await cerrarAplicar();
  } catch (e) {
    // Si la persona dejó todo en su bandeja, no queda regla activa que aplicar: el plan queda aplicado sin mover nada.
    // El motor lo dice de dos formas: sin política activa o sin propuestas aceptadas que activen políticas
    if (/sin una pol[ií]tica activa|no tiene propuestas aceptadas que activen/i.test(String((e && e.message) || ''))) {
      P.aplicado = { movidos: 0, completo: true, bajas: [], sinReglas: true };
      await cerrarAplicar();
      pintar();
      return;
    }
    P.fase = 'simulacro';
    // Si Gmail rechaza a media acción, lo ya movido quedó en Actividad con su Deshacer; reintentar no lo repite
    const alcance = String((e && e.message) || '').match(/Lo que alcancé \((\d+) de (\d+)\)/);
    estado.ui.aplicar = { fase: 'error', texto: textoError(e, 'No pude terminar de aplicar tus instrucciones.' + (alcance ? ' Lo que alcancé a mover (' + separarMiles(+alcance[1]) + ' de ' + separarMiles(+alcance[2]) + ') quedó en Actividad, con Deshacer.' : '')), reintentar: aplicarPlan };
    estado.focoSiguiente = 'reintentar:aplicar';
  }
  pintar();
}


/* ==========================================================================
   7 · Hojas: una política, la prioridad de un pendiente y la memoria de una
   persona o una organización
   ========================================================================== */
const hoja = document.getElementById('hoja');
const velo = document.getElementById('velo');
const CERRAR_HOJA = '<button class="btn btn--s btn--grande" data-accion="cerrar-hoja">Cerrar</button>';

function abrirHoja(html, meta) {
  estado.hoja = meta;
  hoja.innerHTML = html;
  if (hoja.querySelector('#hoja-titulo')) hoja.setAttribute('aria-labelledby', 'hoja-titulo'); else hoja.removeAttribute('aria-labelledby');
  hoja.hidden = false;
  velo.hidden = false;
  hoja.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => { hoja.classList.add('abierta'); velo.classList.add('abierto'); }));
  const inicial = hoja.querySelector('[aria-pressed="true"]') || hoja.querySelector('h2');
  if (inicial) inicial.focus({ preventScroll: true });
}
function cerrarHoja() {
  if (!estado.hoja) return;
  // Cerrar durante la ventana de Enviar cancela el envío, y Hoy lo dice hasta que la persona lo vea
  let cancelado = '';
  if (estado.hoja.envio) {
    const l = estado.datos.hoy && listosPorContestar(estado.datos.hoy).find(x => x.id_hilo === estado.hoja.envio.hilo);
    clearInterval(estado.hoja.envio.reloj); estado.hoja.envio = null;
    cancelado = 'No se envió tu respuesta' + (l ? ' a ' + l.persona : '') + '. Sigue en tus borradores.';
  }
  const volver = estado.hoja.volverA;
  estado.hoja = null;
  if (cancelado) avisarEnvio(cancelado);
  hoja.classList.remove('abierta');
  velo.classList.remove('abierto');
  const reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { if (!estado.hoja) { hoja.hidden = true; velo.hidden = true; } }, reducir ? 0 : 300);
  const el = volver && principal.querySelector('[data-foco="' + (window.CSS && CSS.escape ? CSS.escape(volver) : volver) + '"]');
  if (el) el.focus({ preventScroll: true });
}
function opcionesNivel(opciones, actual, accion) {
  return '<div class="grupo">' + opciones.map(n => '<button class="item fila fila--boton opcion" data-accion="' + accion + '" data-valor="' + n.id + '" aria-pressed="' + (n.id === actual) + '">' +
    '<span class="fila__txt"><span class="fila__t">' + esc(n.corto) + '</span><span class="fila__s">' + esc(n.que_hace) + '</span></span>' + (n.id === actual ? PALOMITA : '<span style="width:15px"></span>') + '</button>').join('') + '</div>';
}

/* ---------- Una política ---------- */
// Desde Lo que Opus sabe de ti se abre una política sin haber pasado por Políticas: sirve la lista que trajo cualquier vista
function buscarPolitica(id) { return ((estado.datos.politicas || {}).politicas || estado.listaPoliticas || []).find(x => x.id === id) || null; }
function abrirPolitica(id) {
  const p = buscarPolitica(id);
  if (!p) return;
  const d = estado.datos.politicas;
  let h = '<div class="hoja__asa" aria-hidden="true"></div><div class="ficha">' + mosaico(p.icono, (p.tono || '') + ' heroe') +
    '<h2 id="hoja-titulo" tabindex="-1">' + (p.estado === 'borrador' ? '«' + escSinCorte(p.texto) + '»' : esc(p.nombre)) + '</h2>' +
    (p.estado === 'borrador' ? '' : '<p class="hoja__sub">' + escSinCorte(textoPolitica(p)) + '</p>' + (p.clave === 'bajas' ? '<p class="hoja__sub">' + BAJAS_SIN_DESHACER + '</p>' : '')) + (p.cuandoTexto && p.estado !== 'borrador' ? '<p class="hoja__sub">' + esc(p.cuandoTexto) + '</p>' : '') +
    '<p class="aprendido">' + esc(p.origenTexto) + '</p></div>';
  if (p.estado === 'borrador') {
    h += '<div class="grupo"><div class="item"><p class="fila__t">Opus lo aplica ' + siguienteRevision() + '.</p><p class="fila__s">Lo que pides ya es tu sí. Después lo ves en Lo que hice hoy, con Deshacer.</p></div></div>' +
      '<div class="acciones acciones--centro"><button class="btn btn--t" data-accion="politica-estado" data-estado="retirada">Ya no la quiero</button></div>' + CERRAR_HOJA;
    abrirHoja(h, { tipo: 'politica', id: id, volverA: 'pol:' + id });
    return;
  }
  const prueba = p.prueba ? '<h3 class="sec__cab hoja__cab">Prueba con tu correo</h3><div class="grupo"><div class="item"><p class="fila__t">' + esc(p.prueba.texto) + '</p>' +
    ejemplosPrueba(p) + '</div></div>' : '';
  if (p.estado === 'propuesta') {
    h += prueba + '<div class="acciones acciones--centro"><button class="btn btn--p" data-accion="politica-estado" data-estado="activa">Activar</button>' +
      '<button class="btn btn--s" data-accion="politica-estado" data-estado="retirada">No la quiero</button></div>';
  }
  h += '<h3 class="sec__cab hoja__cab">Qué hago</h3>' + opcionesNivel(p.clave === 'bajas' ? NIVELES_BAJAS : NIVELES, p.nivel, 'nivel-politica');
  if (p.metricas.disparos) {
    const m = p.metricas;
    h += '<h3 class="sec__cab hoja__cab">Cómo le va</h3><div class="grupo"><div class="item metricas">' +
      // Tres estados que no se suman: aceptadas (tu sí), observadas (7 días sin deshacer) y sin ver
      [['Aceptadas', m.aceptadas], ['Observadas', m.observadas], ['Sin ver', m.sin_ver], ['Rescates', m.rescates]].map(x =>
        '<div class="metrica"><span class="metrica__n">' + separarMiles(x[1]) + '</span><span class="metrica__t">' + x[0] + '</span></div>').join('') + '</div></div>' +
      '<p class="sec__pie">De ' + esc(plural(m.disparos, 'vez', 'veces')) + (m.ultimo ? ', la última ' + esc(cuandoCorto(m.ultimo)) : '') + '. Observada: pasó 7 días sin que la deshicieras. Rescate: la sacaste de donde la puse.</p>';
  }
  if (p.criterio) h += '<h3 class="sec__cab hoja__cab">Cómo decide Opus</h3><div class="grupo"><div class="item"><p class="fila__t">' + esc(p.criterio) + '</p></div></div>';
  if (p.estado !== 'propuesta') h += prueba;
  if (p.clave === 'juntas') h += '<p class="sec__pie">Necesita permiso para leer tu calendario. Nunca lo cambia.</p>';
  h += '<p class="sec__pie">' + esc(textoSensibles(d && d.sensibles)) + '</p>';
  const botones = [];
  if (p.estado === 'activa' && p.nivel !== 'apagado') botones.push('<button class="btn btn--s" data-accion="politica-estado" data-estado="pausada">Pausar</button>');
  if (p.estado === 'pausada') botones.push('<button class="btn btn--tinte" data-accion="politica-estado" data-estado="activa">Reanudar</button>');
  if (p.origen !== 'catalogo' && p.estado !== 'propuesta') botones.push('<button class="btn btn--t" data-accion="politica-estado" data-estado="retirada">Retirar</button>');
  if (botones.length) h += '<div class="acciones acciones--centro">' + botones.join('') + '</div>';
  abrirHoja(h + CERRAR_HOJA, { tipo: 'politica', id: id, volverA: 'pol:' + id });
}
function marcarPolitica(p, cambios) {
  Object.assign(p, cambios);
  p.activa = p.estado === 'activa' && p.nivel !== 'apagado';
  if (p.clave) estado.politicas[p.clave] = p;
}
function elegirNivelPolitica(nivel) {
  const h = estado.hoja;
  cerrarHoja();
  const p = h && buscarPolitica(h.id);
  if (!p || p.nivel === nivel) return;
  const antes = { nivel: p.nivel, estado: p.estado };
  actuar('pol:' + p.id, 'cambiar_politica', { id: p.id, nivel: nivel }, {
    antes: () => marcarPolitica(p, { nivel: nivel }), alFallar: () => marcarPolitica(p, antes),
    alTerminar: () => ({ texto: p.nombre + ' queda en «' + nivelCorto(nivel) + '». Guardado.' }), foco: false, efimero: 2400, error: 'No se pudo guardar ' + p.nombre + '.'
  });
}
function cambiarEstadoPolitica(nuevo) {
  const h = estado.hoja;
  cerrarHoja();
  const p = h && buscarPolitica(h.id);
  if (!p) return;
  const antes = { nivel: p.nivel, estado: p.estado };
  const que = { activa: 'Activé', pausada: 'Pausé', retirada: 'Retiré' }[nuevo] || 'Cambié';
  actuar('pol:' + p.id, 'cambiar_politica', { id: p.id, estado: nuevo }, {
    antes: () => { if (nuevo !== 'retirada') marcarPolitica(p, { estado: nuevo }); }, alFallar: () => marcarPolitica(p, antes),
    alTerminar: r => ({ tipo: nuevo, texto: que + ' «' + p.nombre + '».' }), foco: nuevo === 'retirada', efimero: nuevo === 'retirada' ? 0 : 2400, error: 'No se pudo cambiar ' + p.nombre + '.'
  });
}

// Ejemplos de la prueba: con asunto, uno por renglón; si solo llegan ids, un enlace a la misma búsqueda en Gmail en lugar
// de varios «Ver el correo» iguales
function ejemplosPrueba(p) {
  const ej = p.prueba.ejemplos;
  if (!ej.length) return '';
  const sueltos = ej.every(e => e.titulo === 'Ver el correo');
  if (!sueltos || ej.length === 1) return listaEjemplos('prueba-' + p.id, ej);
  return p.prueba.busqueda ? listaEjemplos('prueba-' + p.id, [{ titulo: 'Ver los correos en Gmail', url: p.prueba.busqueda }]) : '';
}

/* ---------- La prioridad de un pendiente (corregir_juicio) ---------- */
function buscarDecision(id_hilo) { const d = estado.datos.hoy; return d ? d.te_necesita.find(x => x.id_hilo === id_hilo) || d.riesgo.find(x => x.id_hilo === id_hilo) : null; }
function abrirPrioridad(id_hilo) {
  const x = buscarDecision(id_hilo);
  if (!x) return;
  abrirHoja('<div class="hoja__asa" aria-hidden="true"></div><h2 id="hoja-titulo" tabindex="-1">¿Qué tan importante es?</h2><p class="hoja__sub">' + esc(x.titulo) + '</p>' +
    opcionesNivel(PRIORIDADES, x.prioridad, 'elegir-prioridad') + '<p class="sec__pie">Opus aprende de cada cambio. Lo deshaces desde aquí o desde Actividad.</p>' +
    '<button class="btn btn--s btn--grande" data-accion="cerrar-hoja">Cancelar</button>', { tipo: 'prioridad', id_hilo: id_hilo, volverA: 'pri:' + id_hilo });
}
function corregirPrioridad(x, prioridad, motivo, clave, dicho) {
  const antes = x.prioridad;
  const sale = prioridad === 'baja' || prioridad === 'ruido', fuera = sale || antes === 'riesgo';
  actuar(clave, 'corregir_juicio', { id_hilo: x.id_hilo, prioridad: prioridad, motivo: motivo || '' }, {
    antes: () => { x.prioridad = prioridad; }, alFallar: () => { x.prioridad = antes; },
    // El hecho del motor habla de «juicio»; a la persona se le dice qué pasó con su pendiente
    alTerminar: () => ({ fuera: fuera, texto: dicho || (sale ? 'Lo quité de Hoy. Opus aprende de esto.' : 'Guardado. Opus aprende de esto.') }),
    foco: fuera, efimero: fuera ? 0 : 2400, error: 'No se pudo cambiar la prioridad.'
  });
}
function elegirPrioridad(prioridad) {
  const h = estado.hoja;
  cerrarHoja();
  const x = h && buscarDecision(h.id_hilo);
  if (!x || x.prioridad === prioridad) return;
  corregirPrioridad(x, prioridad, '', 'pri:' + x.id_hilo);
}

/* ---------- Hojas de memoria: persona u organización ----------
   Lo que Opus sabe de cada quien. La persona corrige de un toque si es persona u
   organización, la relación y la importancia, y le enseña cosas en sus palabras.
   Una hoja lleva a otra (Bruno → Grupo Altavista) con Atrás. */
function abrirFicha(ref, nombre, volverA, desde) {
  ['tipo', 'relacion', 'importancia', 'ensenar'].forEach(k => delete estado.ui[k]);
  const meta = { tipo: 'ficha', ref: ref, nombre: nombre || '', volverA: volverA, desde: desde || null, modo: 'ficha', borrador: '' };
  const html = atrasFicha(meta) + '<div class="ficha">' + mono(nombre || '·', { org: !!ref.org, tam: 'xl' }) + '<h2 id="hoja-titulo" tabindex="-1">' + esc(nombre || 'Hoja') + '</h2>' +
    '<p class="hoja__sub">Leyendo su hoja…</p></div>' + CERRAR_HOJA;
  if (estado.hoja) { estado.hoja = meta; hoja.innerHTML = html; hoja.scrollTop = 0; enfocarHoja(); }
  else abrirHoja(html, meta);
  cargarFicha(meta);
}
function elegirFicha(todas, ref, filtro) {
  if (filtro.id) return todas.find(x => x.id === filtro.id);
  if (filtro.dominio) return todas.find(x => x.tipo === 'organizacion') || todas[0];
  return todas.find(x => x.correo === filtro.correo) || todas.find(x => x.tipo === 'persona') || todas[0];
}
async function cargarFicha(meta) {
  const ref = meta.ref;
  const filtro = ref.ficha ? { id: ref.ficha } : ref.org && ref.dominio ? { dominio: ref.dominio } : ref.correo ? { correo: ref.correo } : { dominio: ref.dominio };
  let f = null, personas = [], fallo = false;
  try {
    let todas = (await pedir('ver_memoria', { parte: 'fichas', filtro: filtro })).fichas;
    f = elegirFicha(todas, ref, filtro);
    // La gente de una organización se pide por su id: alguien puede escribir desde un correo personal. El dominio queda de respaldo
    if (f && f.tipo === 'organizacion') {
      let mas = await opcional('ver_memoria', { parte: 'fichas', filtro: { organizacion: f.id } });
      if ((!mas || !mas.fichas.length) && f.dominio) mas = await opcional('ver_memoria', { parte: 'fichas', filtro: { dominio: f.dominio } });
      if (mas) todas = todas.concat(mas.fichas.filter(x => !todas.some(y => y.id === x.id)));
    }
    if (f && f.org && !f.org.nombre) {
      const o = await opcional('ver_memoria', { parte: 'fichas', filtro: { id: f.org.id } });
      if (o && o.fichas[0]) f.org = { id: o.fichas[0].id, nombre: o.fichas[0].nombre };
    }
    if (f) personas = todas.filter(x => x.tipo === 'persona' && x.orgId === f.id);
  } catch (e) { fallo = true; }
  if (estado.hoja !== meta) return;
  if (fallo || !f) {
    hoja.innerHTML = atrasFicha(meta) + '<div class="ficha">' + mono(meta.nombre || '·', { org: !!ref.org, tam: 'xl' }) + '<h2 id="hoja-titulo" tabindex="-1">' + esc(meta.nombre || 'Hoja') + '</h2></div>' +
      (fallo ? '<p class="error" role="alert" style="justify-content:center"><span>No pude leer su hoja.</span><button class="btn btn--t" data-accion="ficha-reintentar">Reintentar</button></p>'
        : '<p class="hoja__sub">Todavía no hay hoja. Opus la arma cuando vea más correos.</p>') + CERRAR_HOJA;
    enfocarHoja();
    return;
  }
  meta.datos = f;
  meta.personas = personas;
  meta.nombre = f.nombre;
  pintarFicha();
  enfocarHoja();
}
function enfocarHoja() { const h = hoja.querySelector('h2'); if (h) h.focus({ preventScroll: true }); }
function atrasFicha(m) {
  return '<div class="hoja__asa" aria-hidden="true"></div>' + (m.desde ? '<button class="btn btn--t ficha__atras" data-accion="ficha-atras">' + CHEV + esc(m.desde.nombre) + '</button>' : '');
}
function segmFicha(campo, opciones, actual, etiqueta) {
  const u = estado.ui[campo] || {};
  return '<div class="segm segm--' + opciones.length + ' segm--hoja" role="radiogroup" aria-label="' + esc(etiqueta) + '">' + opciones.map(o =>
    '<button type="button" class="segm__op" role="radio" aria-checked="' + (o.id === actual) + '" data-accion="ficha-campo" data-campo="' + campo + '" data-valor="' + esc(o.id) + '"' +
    (u.fase === 'enviando' ? ' disabled' : '') + '>' + esc(o.corto) + '</button>').join('') + '</div>';
}
const TIPOS_FICHA = [{ id: 'persona', corto: 'Persona' }, { id: 'organizacion', corto: 'Organización' }];

function pintarFicha() {

      '<h2 id="hoja-titulo" tabindex="-1">Relación con ' + esc(p.nombre) + '</h2><p class="hoja__sub">Opus la usa para decidir qué te interrumpe y qué puede esperar.</p>' +
      '<div class="grupo">' + RELACIONES.map(r => '<button class="item fila fila--boton opcion" data-accion="relacion" data-relacion="' + esc(r) + '" aria-pressed="' + (r === p.relacion) + '">' +
        '<span class="fila__txt fila__t">' + esc(r) + '</span>' + (r === p.relacion ? PALOMITA : '<span style="width:15px"></span>') + '</button>').join('') + '</div>' + CERRAR_HOJA;

  let valorR = esc(p.relacion || 'Sin definir');
  if (uR.fase === 'enviando') valorR = 'Guardando…';

  let html = atrasFicha(m) + '<div class="ficha">' + mono(p.nombre, { org: org, tam: 'xl' }) + '<h2 id="hoja-titulo" tabindex="-1">' + esc(p.nombre) + '</h2>' +
    (sub ? '<p class="hoja__sub">' + sub + '</p>' : '') + '<p class="aprendido">' + ico('destello') + esc(p.definido + (p.actualizada ? ' · ' + diaRelativo(p.actualizada) : '')) + '</p></div>';
  html += '<div class="grupo">' +
    '<div class="item fila fila--control"><span class="fila__txt fila__t">Es</span>' + segmFicha('tipo', TIPOS_FICHA, p.tipo, 'Qué es ' + p.nombre) + '</div>' +
    '<button class="item fila fila--boton" data-accion="ficha-relacion" aria-haspopup="true"><span class="fila__txt fila__t">Relación</span><span class="fila__v">' + valorR + '</span>' + CHEV + '</button>' +
    '<div class="item fila fila--control"><span class="fila__txt fila__t">Importancia</span>' + segmFicha('importancia', IMPORTANCIAS, p.importancia, 'Importancia de ' + p.nombre) + '</div>' +
    (p.ultima ? '<div class="item"><p class="fila__t">Última vez</p><p class="fila__s">' + esc(p.ultima) + '</p></div>' : '') + '</div>' +
    lineaError('tipo') + lineaError('relacion') + lineaError('importancia') +
    '<p class="sec__pie">' + (p.importancia === 'alta' ? 'Importancia alta: nunca la limpio y sale primero en Hoy.' : 'Lo corriges de un toque. Opus aprende de cada cambio.') + '</p>';
  if (org && m.personas && m.personas.length) {
    html += '<h3 class="sec__cab hoja__cab">Personas</h3><div class="grupo grupo--avatar">' + m.personas.map(x =>
      '<button class="item fila fila--boton" data-accion="ficha-persona" data-ficha="' + esc(x.id) + '" data-nombre="' + esc(x.nombre) + '">' + mono(x.nombre, { tam: 's' }) +
      '<span class="fila__txt"><span class="fila__t">' + esc(x.nombre) + '</span>' + (x.rol ? '<span class="fila__s">' + esc(x.rol) + '</span>' : '') + '</span>' + CHEV + '</button>').join('') + '</div>';
  }
  if (p.temas.length) html += '<h3 class="sec__cab hoja__cab">Temas abiertos</h3><div class="grupo">' + p.temas.map(t => '<div class="item fila"><p class="fila__t">' + esc(t) + '</p></div>').join('') + '</div>';
